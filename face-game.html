<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎭 Bạn Là Ai? – Trò Chơi Ma Thuật</title>
  <!-- face-api.js v0.22.2 – tested, exports window.faceapi reliably -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #06050f;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
      color: #fff;
    }

    /* ── starfield ── */
    #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── screens ── */
    .screen {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
      display: flex; flex-direction: column;
      align-items: center; padding: 16px; gap: 12px;
    }
    .hidden { display: none !important; }

    /* ── loading ── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 500;
      background: #06050f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    .spinner {
      width: 52px; height: 52px;
      border: 3px solid rgba(240,192,64,.18);
      border-top-color: #f0c040;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #load-text { color: #f0c040; font-size: .95em; letter-spacing: .04em; text-align: center; max-width: 280px; }

    /* ── title ── */
    .game-title {
      font-size: 2em;
      background: linear-gradient(135deg,#f0c040,#e8830a,#f0c040);
      background-size: 200%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
      text-align: center; line-height: 1.2;
    }
    @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }
    .subtitle { color: rgba(255,255,255,.65); font-size: .9em; text-align: center; line-height: 1.6; }

    /* ── portrait frame ── */
    .portrait-wrapper {
      position: relative; width: 280px; height: 420px;
    }
    .portrait-wrapper::before {
      content: ''; position: absolute; inset: -3px; border-radius: 10px;
      background: linear-gradient(45deg,#f0c040,#e83060,#3090f0,#60f090,#f0c040);
      background-size: 300%;
      animation: borderSpin 4s linear infinite;
      z-index: -1; filter: blur(5px);
    }
    @keyframes borderSpin { 0%{background-position:0%} 100%{background-position:300%} }

    #webcam-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      border-radius: 8px;
    }
    #portrait-canvas, #guide-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border-radius: 8px;
    }
    #portrait-canvas { z-index: 2; }
    #guide-canvas    { z-index: 3; pointer-events: none; }

    /* ── progress ── */
    #progress-track {
      width: 280px; height: 12px;
      background: rgba(255,255,255,.1);
      border-radius: 999px; overflow: hidden;
    }
    #progress-fill {
      height: 100%; width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg,#e83060,#f0c040);
      transition: width .12s ease;
      box-shadow: 0 0 8px rgba(240,192,64,.5);
    }
    #status-text {
      color: rgba(255,255,255,.7); font-size: .85em;
      text-align: center; min-height: 1.4em;
    }

    /* ── buttons ── */
    .btn {
      padding: 12px 36px; border: none; border-radius: 999px;
      cursor: pointer; font-size: 1.05em;
      font-family: inherit; font-weight: bold;
      transition: transform .15s, box-shadow .15s; outline: none;
    }
    .btn:hover  { transform: scale(1.06); }
    .btn:active { transform: scale(.97); }
    .btn-gold {
      background: linear-gradient(135deg,#f0c040,#e8830a);
      color: #1a0800;
      box-shadow: 0 4px 22px rgba(240,192,64,.45);
    }
    .btn-gold:hover { box-shadow: 0 6px 32px rgba(240,192,64,.75); }

    /* ── win screen ── */
    #win-canvas { width: 280px; height: 420px; border-radius: 8px; display: block; }
    #win-msg {
      text-align: center; font-size: 1.18em; line-height: 1.65;
      color: #f0c040;
      animation: glowPulse 1.6s ease-in-out infinite alternate;
      max-width: 320px;
    }
    @keyframes glowPulse {
      from { text-shadow: 0 0 10px #f0c040, 0 0 20px rgba(240,100,0,.5); }
      to   { text-shadow: 0 0 30px #f0c040, 0 0 60px orange, 0 0 90px yellow; }
    }

    /* ── particles ── */
    .spark {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 400;
      animation: sparkFly linear forwards;
    }
    @keyframes sparkFly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(0); }
    }

    /* ── intro preview ── */
    #preview-canvas { width: 140px; height: 210px; border-radius: 6px; }
  </style>
</head>
<body>

<canvas id="starfield"></canvas>

<!-- ── LOADING ── -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p id="load-text">Đang triệu hồi phép thuật… ✨</p>
</div>

<!-- ── INTRO ── -->
<div id="intro-screen" class="screen hidden">
  <div class="game-title">🎭 Bạn Là Ai?</div>
  <p class="subtitle">
    Một bức chân dung huyền bí đang thiếu một phần.<br>
    Hãy đặt <strong>mũi</strong> và <strong>miệng</strong> của bạn vào ô trống!
  </p>
  <canvas id="preview-canvas" width="140" height="210"></canvas>
  <p class="subtitle" style="font-size:.78em; color:rgba(255,220,80,.6);">👆 Ô vàng chờ bạn hoàn thiện</p>
  <button id="start-btn" class="btn btn-gold">🎬 Bắt Đầu Chơi</button>
  <p style="color:rgba(255,255,255,.3); font-size:.72em;">Cần cho phép truy cập camera</p>
</div>

<!-- ── GAME ── -->
<div id="game-screen" class="screen hidden">
  <div class="game-title" style="font-size:1.3em;">🎭 Nhân Vật Bí Ẩn</div>
  <p class="subtitle" style="font-size:.82em;">Đặt mũi và miệng vào ô vàng ✨</p>
  <div class="portrait-wrapper">
    <video id="webcam-video" autoplay muted playsinline></video>
    <canvas id="portrait-canvas" width="280" height="420"></canvas>
    <canvas id="guide-canvas"    width="280" height="420"></canvas>
  </div>
  <div id="progress-track"><div id="progress-fill"></div></div>
  <p id="status-text">👆 Di chuyển mặt vào ô trống…</p>
</div>

<!-- ── WIN ── -->
<div id="win-screen" class="screen hidden">
  <div class="game-title" style="font-size:1.25em;">✨ PHÉP THUẬT! ✨</div>
  <canvas id="win-canvas" width="280" height="420"></canvas>
  <p id="win-msg"></p>
  <button id="again-btn" class="btn btn-gold" style="margin-top:4px">🔄 Chơi Lại</button>
</div>

<!-- hidden – face detection processes here -->
<canvas id="proc-canvas" width="280" height="420" style="display:none"></canvas>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════
const W = 280, H = 420;

// Models – @vladmandic/face-api includes weights inside npm package ✓
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model';

// Portrait: Mona Lisa (public domain, Wikimedia Commons, CORS: *)
const PORTRAIT_SRC =
  'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/' +
  'Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg/' +
  '402px-Mona_Lisa%2C_by_Leonardo_da_Vinci%2C_from_C2RMF_retouched.jpg';

const CHARACTER = 'Mona Lisa';

// Hole: covers nose + mouth of Mona Lisa at 280×420
const HOLE_XF = 0.26, HOLE_YF = 0.335;
const HOLE_WF = 0.48, HOLE_HF = 0.235;

// Win tuning
const TOLERANCE_F = 0.30;   // fraction of hole.w = alignment radius
const BUFFER_SIZE  = 38;    // rolling frames to average
const WIN_THRESH   = 0.76;  // avg score threshold

// ═══════════════════════════════════════════════════════
//  ELEMENTS
// ═══════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const loadingScreen = $('loading-screen');
const introScreen   = $('intro-screen');
const gameScreen    = $('game-screen');
const winScreen     = $('win-screen');
const videoEl       = $('webcam-video');
const pCanvas       = $('portrait-canvas');
const gCanvas       = $('guide-canvas');
const procCanvas    = $('proc-canvas');
const winCanvas     = $('win-canvas');
const prevCanvas    = $('preview-canvas');
const progressFill  = $('progress-fill');
const statusText    = $('status-text');
const winMsg        = $('win-msg');

const pCtx    = pCanvas.getContext('2d');
const gCtx    = gCanvas.getContext('2d');
const procCtx = procCanvas.getContext('2d');
const winCtx  = winCanvas.getContext('2d');
const prevCtx = prevCanvas.getContext('2d');

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let portrait = null;          // Image element, set after blob-URL load succeeds

let hole = {};
let mediaStream = null;
let detecting   = false;
let winDone     = false;
let alignBuf    = [];
let detectTimer = null;
let guideRAF    = null;

// ═══════════════════════════════════════════════════════
//  GEOMETRY
// ═══════════════════════════════════════════════════════
function computeHole() {
  hole.x  = Math.round(HOLE_XF * W);
  hole.y  = Math.round(HOLE_YF * H);
  hole.w  = Math.round(HOLE_WF * W);
  hole.h  = Math.round(HOLE_HF * H);
  hole.cx = hole.x + hole.w / 2;
  hole.cy = hole.y + hole.h / 2;
  // nose target: upper 30 % of hole height
  hole.noseTgt  = { x: hole.cx, y: hole.y + hole.h * 0.30 };
  // mouth target: lower 72 % of hole height
  hole.mouthTgt = { x: hole.cx, y: hole.y + hole.h * 0.72 };
  hole.tol      = hole.w * TOLERANCE_F;
}

// ═══════════════════════════════════════════════════════
//  CANVAS HELPERS
// ═══════════════════════════════════════════════════════
function rrPath(ctx, x, y, w, h, r = 8) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ── Programmatic "Mona Lisa" portrait drawn with Canvas 2D ──────────────────
function drawFallbackPortrait(ctx, cw, ch) {
  const sc = cw / 280;

  // Background – warm aged canvas
  const bg = ctx.createLinearGradient(0, 0, 0, ch);
  bg.addColorStop(0,   '#52412a');
  bg.addColorStop(0.45,'#6a4e2c');
  bg.addColorStop(1,   '#2a1a08');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);

  // Left landscape hill
  ctx.fillStyle = '#3d5a48';
  ctx.beginPath();
  ctx.moveTo(0, ch * 0.48);
  ctx.quadraticCurveTo(cw * 0.12, ch * 0.22, cw * 0.32, ch * 0.36);
  ctx.lineTo(cw * 0.32, ch); ctx.lineTo(0, ch);
  ctx.fill();

  // Right landscape hill
  ctx.fillStyle = '#2d4a38';
  ctx.beginPath();
  ctx.moveTo(cw, ch * 0.52);
  ctx.quadraticCurveTo(cw * 0.88, ch * 0.24, cw * 0.68, ch * 0.38);
  ctx.lineTo(cw * 0.68, ch); ctx.lineTo(cw, ch);
  ctx.fill();

  // Misty sky overlay
  const sky = ctx.createLinearGradient(0, 0, 0, ch * 0.38);
  sky.addColorStop(0, 'rgba(50,75,90,.75)');
  sky.addColorStop(1, 'rgba(50,75,90,0)');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, cw, ch * 0.38);

  // Dark dress / body – lower half
  ctx.fillStyle = '#2c3322';
  ctx.beginPath();
  ctx.moveTo(0, ch);
  ctx.lineTo(cw, ch);
  ctx.lineTo(cw * 0.94, ch * 0.64);
  ctx.bezierCurveTo(cw * 0.82, ch * 0.54, cw * 0.65, ch * 0.54, cw * 0.58, ch * 0.62);
  ctx.bezierCurveTo(cw * 0.55, ch * 0.67, cw * 0.50, ch * 0.67, cw * 0.42, ch * 0.62);
  ctx.bezierCurveTo(cw * 0.35, ch * 0.54, cw * 0.18, ch * 0.54, cw * 0.06, ch * 0.64);
  ctx.closePath();
  ctx.fill();

  // Dress fold lines
  ctx.strokeStyle = 'rgba(100,90,60,.35)';
  ctx.lineWidth = 1.5 * sc;
  [[0.18, 0.72, 0.16, 1.0], [0.42, 0.70, 0.40, 1.0], [0.62, 0.70, 0.64, 1.0]]
    .forEach(([x1, y1, x2, y2]) => {
      ctx.beginPath();
      ctx.moveTo(cw * x1, ch * y1);
      ctx.lineTo(cw * x2, ch * y2);
      ctx.stroke();
    });

  const skin   = '#c09060';
  const skinLt = '#d4a878';

  // Neck
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.ellipse(cw * 0.5, ch * 0.635, cw * 0.065, ch * 0.055, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Face oval ──
  const fcx = cw * 0.5, fcy = ch * 0.355;
  const frx = cw * 0.21, fry = ch * 0.215;

  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.ellipse(fcx, fcy, frx, fry, 0, 0, Math.PI * 2);
  ctx.fill();

  // Face edge shadow
  const fSh = ctx.createRadialGradient(fcx, fcy, frx * 0.4, fcx, fcy, frx * 1.05);
  fSh.addColorStop(0, 'rgba(0,0,0,0)');
  fSh.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = fSh;
  ctx.beginPath();
  ctx.ellipse(fcx, fcy, frx, fry, 0, 0, Math.PI * 2);
  ctx.fill();

  // Chin patch below hole (the hole ends at HOLE_YF+HOLE_HF = 0.57*ch)
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.ellipse(cw * 0.5, ch * 0.592, cw * 0.095, ch * 0.038, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Hair ──
  const hairC = '#221208';
  const hairSh = '#3a2010';

  // Left hair mass
  ctx.fillStyle = hairC;
  ctx.beginPath();
  ctx.moveTo(fcx - frx, fcy - fry * 0.4);
  ctx.bezierCurveTo(cw * 0.18, fcy - fry * 0.15, cw * 0.14, fcy + fry * 0.5, cw * 0.16, fcy + fry * 0.95);
  ctx.bezierCurveTo(cw * 0.20, fcy + fry * 1.1, cw * 0.30, fcy + fry * 0.85, fcx - frx * 0.82, fcy - fry * 0.72);
  ctx.fill();

  // Right hair mass
  ctx.beginPath();
  ctx.moveTo(fcx + frx, fcy - fry * 0.4);
  ctx.bezierCurveTo(cw * 0.82, fcy - fry * 0.15, cw * 0.86, fcy + fry * 0.5, cw * 0.84, fcy + fry * 0.95);
  ctx.bezierCurveTo(cw * 0.80, fcy + fry * 1.1, cw * 0.70, fcy + fry * 0.85, fcx + frx * 0.82, fcy - fry * 0.72);
  ctx.fill();

  // Top hair / head covering
  ctx.fillStyle = '#1a0e06';
  ctx.beginPath();
  ctx.ellipse(fcx, fcy - fry * 0.68, frx * 0.88, fry * 0.48, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hair highlights (subtle strands)
  ctx.strokeStyle = hairSh;
  ctx.lineWidth = 1 * sc;
  [[-0.28, -0.3, -0.30, 0.6], [0.28, -0.3, 0.30, 0.6]].forEach(([dx1,dy1,dx2,dy2]) => {
    ctx.beginPath();
    ctx.moveTo(fcx + frx * dx1, fcy + fry * dy1);
    ctx.quadraticCurveTo(fcx + frx * dx1 * 1.4, fcy + fry * 0.15, fcx + frx * dx2, fcy + fry * dy2);
    ctx.stroke();
  });

  // ── Eyes (above the hole) ──
  // Hole top = HOLE_YF * ch = 0.335 * ch
  // Eyes at ch * 0.255 (safely above hole)
  const eyeY = ch * 0.258;
  const eyeOX = cw * 0.083; // horizontal offset from center

  function drawEye(ex, ey) {
    // White
    ctx.fillStyle = skinLt;
    ctx.beginPath();
    ctx.ellipse(ex, ey, cw * 0.048, ch * 0.017, 0, 0, Math.PI * 2);
    ctx.fill();
    // Iris
    ctx.fillStyle = '#4a3215';
    ctx.beginPath();
    ctx.ellipse(ex, ey, cw * 0.024, ch * 0.015, 0, 0, Math.PI * 2);
    ctx.fill();
    // Pupil
    ctx.fillStyle = '#14080a';
    ctx.beginPath();
    ctx.ellipse(ex, ey, cw * 0.011, ch * 0.012, 0, 0, Math.PI * 2);
    ctx.fill();
    // Upper lid line
    ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 1.3 * sc;
    ctx.beginPath();
    ctx.ellipse(ex, ey - ch * 0.002, cw * 0.048, ch * 0.017, 0, Math.PI, 0);
    ctx.stroke();
  }

  drawEye(fcx - eyeOX, eyeY);
  drawEye(fcx + eyeOX, eyeY);

  // Barely-there brows (Mona Lisa has famously faint brows)
  ctx.strokeStyle = 'rgba(55,35,12,.45)';
  ctx.lineWidth = 1.4 * sc;
  ctx.beginPath();
  ctx.moveTo(fcx - eyeOX - cw * 0.045, eyeY - ch * 0.028);
  ctx.quadraticCurveTo(fcx - eyeOX, eyeY - ch * 0.034, fcx - eyeOX + cw * 0.038, eyeY - ch * 0.025);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(fcx + eyeOX - cw * 0.038, eyeY - ch * 0.025);
  ctx.quadraticCurveTo(fcx + eyeOX, eyeY - ch * 0.034, fcx + eyeOX + cw * 0.045, eyeY - ch * 0.028);
  ctx.stroke();

  // ── Label ──
  ctx.fillStyle = 'rgba(225,185,72,.82)';
  ctx.font = `bold ${Math.round(cw * 0.071)}px Georgia, serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('MONA LISA', cw / 2, ch * 0.978);

  // ── Vignette ──
  const vig = ctx.createRadialGradient(cw/2, ch/2, cw * 0.28, cw/2, ch/2, cw * 0.88);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,.52)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, cw, ch);
}

// ── Draw portrait (real image or fallback) + punch hole + gold border ────────
function drawPortraitWithHole(ctx, cw, ch) {
  ctx.clearRect(0, 0, cw, ch);

  if (portrait && portrait.complete && portrait.naturalWidth > 0) {
    try { ctx.drawImage(portrait, 0, 0, cw, ch); }
    catch(_) { drawFallbackPortrait(ctx, cw, ch); }
  } else {
    drawFallbackPortrait(ctx, cw, ch);
  }

  const sx = cw / W, sy = ch / H;
  const hx = hole.x * sx, hy = hole.y * sy;
  const hw = hole.w * sx, hh = hole.h * sy;

  // Punch transparent hole
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'black';
  rrPath(ctx, hx, hy, hw, hh, 8 * sx);
  ctx.fill();
  ctx.restore();

  // Gold glowing border
  ctx.save();
  ctx.strokeStyle = 'rgba(240,192,64,.92)';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#f0c040'; ctx.shadowBlur = 14;
  rrPath(ctx, hx, hy, hw, hh, 8 * sx);
  ctx.stroke();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
//  GUIDE OVERLAY
// ═══════════════════════════════════════════════════════
function drawGuide(nosePos, mouthPos, noseOk, mouthOk, noFace) {
  gCtx.clearRect(0, 0, W, H);
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);

  function crosshair(x, y, ok) {
    const col = ok
      ? `rgba(80,255,80,${.65 + .35 * pulse})`
      : `rgba(240,192,64,${.45 + .45 * pulse})`;
    gCtx.save();
    gCtx.strokeStyle = col; gCtx.lineWidth = 1.8;
    gCtx.shadowColor = ok ? '#80ff80' : '#f0c040';
    gCtx.shadowBlur  = ok ? 14 : 9;
    gCtx.beginPath(); gCtx.arc(x, y, 7, 0, Math.PI * 2); gCtx.stroke();
    gCtx.beginPath();
    [[-14,-12],[-12,-14],[12,-14],[14,-12],[14,12],[12,14],[-12,14],[-14,12]]
      .forEach(([dx, dy], i) => { if (i % 2 === 0) gCtx.moveTo(x+dx, y+dy); else gCtx.lineTo(x+dx, y+dy); });
    gCtx.stroke();
    gCtx.restore();
  }

  crosshair(hole.noseTgt.x,  hole.noseTgt.y,  noseOk);
  crosshair(hole.mouthTgt.x, hole.mouthTgt.y, mouthOk);

  if (!noFace) {
    const dot = (pos, ok) => {
      if (!pos) return;
      gCtx.save();
      gCtx.beginPath(); gCtx.arc(pos.x, pos.y, 5, 0, Math.PI * 2);
      gCtx.fillStyle = ok ? 'rgba(80,255,80,.85)' : 'rgba(255,80,80,.75)';
      gCtx.shadowColor = ok ? '#80ff80' : '#ff5050'; gCtx.shadowBlur = 10;
      gCtx.fill(); gCtx.restore();
    };
    dot(nosePos, noseOk); dot(mouthPos, mouthOk);

    if (noseOk && mouthOk) {
      gCtx.save();
      gCtx.strokeStyle = `rgba(80,255,80,${.45 + .55 * pulse})`;
      gCtx.lineWidth = 3; gCtx.shadowColor = '#80ff80'; gCtx.shadowBlur = 20;
      rrPath(gCtx, hole.x + 3, hole.y + 3, hole.w - 6, hole.h - 6, 7);
      gCtx.stroke(); gCtx.restore();
    }
  }
}

// ═══════════════════════════════════════════════════════
//  FACE DETECTION (runs every ~110 ms)
// ═══════════════════════════════════════════════════════
async function detect() {
  if (!detecting || winDone) return;

  // Mirror video onto proc canvas
  procCtx.save();
  procCtx.translate(W, 0); procCtx.scale(-1, 1);
  procCtx.drawImage(videoEl, 0, 0, W, H);
  procCtx.restore();

  try {
    const det = await faceapi
      .detectSingleFace(procCanvas, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.35 }))
      .withFaceLandmarks(true);   // true = use tiny landmark model

    if (!det) {
      drawGuide(null, null, false, false, true);
      push(0);
      statusText.textContent = '👆 Di chuyển mặt vào ô trống…';
      setProgress(avg());
      return;
    }

    const pts = det.landmarks.positions;
    // 68-point model: 30 = nose tip, 48/54 = mouth corners, 51/57 = mouth top/bottom
    const nosePos  = pts[30];
    const mouthPos = {
      x: (pts[48].x + pts[54].x) / 2,
      y: (pts[51].y + pts[57].y) / 2,
    };

    const nd   = dist(nosePos,  hole.noseTgt);
    const md   = dist(mouthPos, hole.mouthTgt);
    const nOk  = nd < hole.tol;
    const mOk  = md < hole.tol;

    drawGuide(nosePos, mouthPos, nOk, mOk, false);
    push(score(nd) * 0.5 + score(md) * 0.5);
    const a = avg();
    setProgress(a);

    statusText.textContent =
      nOk && mOk  ? '🎯 Giữ nguyên…' :
      nOk || mOk  ? '📐 Gần rồi! Điều chỉnh thêm' :
                    '👆 Di chuyển mặt vào ô trống…';

    if (a >= WIN_THRESH && alignBuf.length >= Math.floor(BUFFER_SIZE * 0.85)) {
      triggerWin();
    }
  } catch (_) { /* ignore single-frame errors */ }
}

const dist  = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const score = d  => Math.max(0, 1 - d / (hole.tol * 2.5));
const push  = v  => { alignBuf.push(v); if (alignBuf.length > BUFFER_SIZE) alignBuf.shift(); };
const avg   = () => alignBuf.length ? alignBuf.reduce((a,b) => a+b, 0) / alignBuf.length : 0;
const setProgress = f => { progressFill.style.width = Math.min(100, f * 100) + '%'; };

// ═══════════════════════════════════════════════════════
//  WIN SEQUENCE
// ═══════════════════════════════════════════════════════
async function triggerWin() {
  if (winDone) return;
  winDone = true; detecting = false;
  clearInterval(detectTimer); cancelAnimationFrame(guideRAF);

  // Freeze current mirrored frame
  const frozen = document.createElement('canvas');
  frozen.width = W; frozen.height = H;
  const fCtx = frozen.getContext('2d');
  fCtx.save(); fCtx.translate(W, 0); fCtx.scale(-1, 1);
  fCtx.drawImage(videoEl, 0, 0, W, H); fCtx.restore();

  // Stop camera
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

  gameScreen.classList.add('hidden');
  winScreen.classList.remove('hidden');
  await sleep(60);
  await animateReveal(frozen);
}

async function animateReveal(frozen) {
  const STEPS = 48;
  spawnSparks(35, winCanvas);
  await sleep(280);

  const drawPortraitFull = (ctx) => {
    if (portrait && portrait.complete && portrait.naturalWidth > 0) {
      try { ctx.drawImage(portrait, 0, 0, W, H); return; } catch(_) {}
    }
    drawFallbackPortrait(ctx, W, H);
  };

  for (let i = 0; i <= STEPS; i++) {
    const t = eio(i / STEPS);
    winCtx.clearRect(0, 0, W, H);
    drawPortraitFull(winCtx);

    // Frozen face fades out of the hole
    const fα = Math.max(0, 1 - t * 1.55);
    if (fα > 0) {
      winCtx.save(); winCtx.globalAlpha = fα;
      winCtx.drawImage(frozen, hole.x, hole.y, hole.w, hole.h, hole.x, hole.y, hole.w, hole.h);
      winCtx.restore();
    }

    // Golden shimmer fills hole
    if (t > 0.25) {
      const sα = Math.min(1, (t - 0.25) / 0.55) * 0.55;
      winCtx.save();
      const g = winCtx.createRadialGradient(hole.cx, hole.cy, 0, hole.cx, hole.cy, hole.w * 0.65);
      g.addColorStop(0, `rgba(255,230,100,${sα})`);
      g.addColorStop(1, 'rgba(240,100,20,0)');
      winCtx.fillStyle = g;
      rrPath(winCtx, hole.x, hole.y, hole.w, hole.h, 8);
      winCtx.fill(); winCtx.restore();
    }

    if (i % 7 === 0) spawnSparks(5, winCanvas);
    await sleep(22);
  }

  // Final clean portrait + subtle gold veil
  winCtx.clearRect(0, 0, W, H);
  drawPortraitFull(winCtx);
  winCtx.save(); winCtx.globalAlpha = 0.11;
  winCtx.fillStyle = '#f0c040'; winCtx.fillRect(0, 0, W, H);
  winCtx.restore();

  spawnSparks(55, winCanvas);

  await sleep(320);
  winMsg.innerHTML =
    `😱 Ôi trời! Bạn có thật là <span style="color:gold;font-style:italic">${CHARACTER}</span> không vậy?!<br>` +
    `<span style="font-size:.8em;color:rgba(255,220,80,.85)">✨ Nụ cười huyền bí đó… đích thực là của bạn rồi!</span><br>` +
    `<span style="font-size:.7em;color:rgba(255,200,60,.7)">🎨 Phải chăng Leonardo đã vẽ bạn từ 500 năm trước?</span>`;

  for (let i = 0; i < 4; i++) { await sleep(320); spawnSparks(18, winCanvas); }
}

const eio   = t => t < .5 ? 2*t*t : -1 + (4 - 2*t)*t;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ═══════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════
const COLORS = ['#f0c040','#ff6b6b','#6bdcff','#c040f0','#40ff90','#fff','#ffa040','#ff40a0'];

function spawnSparks(n, anchor) {
  const r = anchor.getBoundingClientRect();
  const cx = r.left + r.width / 2 + scrollX;
  const cy = r.top  + r.height / 2 + scrollY;

  for (let i = 0; i < n; i++) {
    const el  = document.createElement('div');
    el.className = 'spark';
    const sz  = 5 + Math.random() * 9;
    const ang = Math.random() * Math.PI * 2;
    const rad = 60 + Math.random() * 260;
    const dur = 0.8 + Math.random() * 1.2;
    Object.assign(el.style, {
      left: (cx + (Math.random() - .5) * 280) + 'px',
      top:  (cy + (Math.random() - .5) * 180) + 'px',
      width: sz + 'px', height: sz + 'px',
      background: COLORS[Math.random() * COLORS.length | 0],
      '--tx': (Math.cos(ang) * rad) + 'px',
      '--ty': (Math.sin(ang) * rad - 80 - Math.random() * 120) + 'px',
      animationDuration: dur + 's',
      animationDelay:    (Math.random() * .2) + 's',
    });
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + .2) * 1000 + 200);
  }
}

// ═══════════════════════════════════════════════════════
//  STARFIELD
// ═══════════════════════════════════════════════════════
function initStars() {
  const c = $('starfield');
  const resize = () => { c.width = innerWidth; c.height = innerHeight; };
  resize(); window.addEventListener('resize', resize);
  const ctx = c.getContext('2d');
  const stars = Array.from({length: 160}, () => ({
    x: Math.random() * c.width, y: Math.random() * c.height,
    r: .2 + Math.random() * 1.5, s: Math.random() * Math.PI * 2,
    sp: .003 + Math.random() * .008,
  }));
  (function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    stars.forEach(s => {
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,220,${.25 + .75 * (.5 + .5 * Math.sin(s.s))})`;
      ctx.fill(); s.s += s.sp;
    });
    requestAnimationFrame(draw);
  })();
}

// ═══════════════════════════════════════════════════════
//  GUIDE ANIMATION LOOP
// ═══════════════════════════════════════════════════════
function guideLoop() {
  if (!detecting) return;
  drawPortraitWithHole(pCtx, W, H);
  guideRAF = requestAnimationFrame(guideLoop);
}

// ═══════════════════════════════════════════════════════
//  START GAME
// ═══════════════════════════════════════════════════════
async function startGame() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    videoEl.srcObject = mediaStream;
    await new Promise(r => { videoEl.onloadedmetadata = r; });
    await videoEl.play();
  } catch (e) {
    alert('Không thể truy cập camera 😢\n' + e.message);
    return;
  }

  winDone = false; detecting = false;
  alignBuf = [];
  progressFill.style.width = '0%';
  statusText.textContent = '👆 Di chuyển mặt vào ô trống…';
  winMsg.innerHTML = '';

  introScreen.classList.add('hidden');
  winScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');

  drawPortraitWithHole(pCtx, W, H);
  detecting = true;
  guideLoop();
  detectTimer = setInterval(detect, 110);
}

// ═══════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════
async function boot() {
  initStars();
  computeHole();

  // 1 · Load portrait via fetch → blob URL (bypasses all canvas CORS issues)
  $('load-text').textContent = 'Đang tải chân dung huyền bí… 🖼️';
  try {
    const resp = await fetch(PORTRAIT_SRC);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob    = await resp.blob();
    const blobURL = URL.createObjectURL(blob);
    portrait = new Image();
    await new Promise((res, rej) => {
      portrait.onload  = res;
      portrait.onerror = rej;
      portrait.src = blobURL;
    });
    // blob URL is same-origin → drawImage to canvas is always safe ✓
  } catch (e) {
    // Fallback portrait (programmatic) will be used – no crash
    console.warn('Portrait fetch failed, using canvas fallback:', e.message);
    portrait = null;
  }

  // 2 · Load AI models
  $('load-text').textContent = 'Đang nạp trí tuệ nhân tạo… 🤖';
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
  } catch (e) {
    throw new Error('Không tải được model AI. Kiểm tra kết nối mạng.\n' + e.message);
  }

  // 3 · Draw intro preview
  drawPortraitWithHole(prevCtx, 140, 210);

  // 4 · Show intro
  loadingScreen.classList.add('hidden');
  introScreen.classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════
$('start-btn').addEventListener('click', startGame);
$('again-btn').addEventListener('click', () => {
  winScreen.classList.add('hidden');
  introScreen.classList.remove('hidden');
});

// ═══════════════════════════════════════════════════════
//  GO
// ═══════════════════════════════════════════════════════
boot().catch(err => {
  console.error('Boot error:', err);
  $('loading-screen').innerHTML = `
    <p style="color:#ff8080;font-size:1.05em">Lỗi khởi động game 😢</p>
    <p style="color:rgba(255,255,255,.45);font-size:.78em;margin:10px 20px;text-align:center">${err.message}</p>
    <button onclick="location.reload()" style="margin-top:18px;padding:10px 28px;background:linear-gradient(135deg,#f0c040,#e8830a);border:none;border-radius:999px;cursor:pointer;font-weight:bold;color:#1a0800">🔄 Thử lại</button>`;
});
</script>
