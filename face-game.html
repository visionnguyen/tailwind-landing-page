<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎭 Bạn Là Ai?</title>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Georgia', serif; color: #fff; }

    /* ═══ FULL-SCREEN GAME CONTAINER ═══ */
    #game-container { position: fixed; inset: 0; width: 100vw; height: 100vh; }

    #webcam-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #portrait-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 2;
    }
    #guide-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* ═══ 4-EDGE LOADING BORDER ═══ */
    .edge-loader {
      position: fixed; z-index: 20; pointer-events: none;
      opacity: 0; transition: opacity .3s;
    }
    .edge-loader.active { opacity: 1; }

    #edge-top, #edge-bottom {
      left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg,
        transparent 0%, transparent 30%,
        #f0c040 48%, #fff 50%, #f0c040 52%,
        transparent 70%, transparent 100%);
      background-size: 300% 100%;
    }
    #edge-left, #edge-right {
      top: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg,
        transparent 0%, transparent 30%,
        #f0c040 48%, #fff 50%, #f0c040 52%,
        transparent 70%, transparent 100%);
      background-size: 100% 300%;
    }
    #edge-top    { top: 0;    animation: sweepH 1.6s linear infinite; }
    #edge-bottom { bottom: 0; animation: sweepH 1.6s linear infinite reverse; }
    #edge-left   { left: 0;   animation: sweepV 1.6s linear infinite 0.4s; }
    #edge-right  { right: 0;  animation: sweepV 1.6s linear infinite reverse 0.4s; }

    @keyframes sweepH {
      0%   { background-position: -100% 0;  box-shadow: none; }
      50%  { box-shadow: 0 0 14px #f0c040, 0 0 28px rgba(240,192,64,.5); }
      100% { background-position:  200% 0;  box-shadow: none; }
    }
    @keyframes sweepV {
      0%   { background-position: 0 -100%; box-shadow: none; }
      50%  { box-shadow: 0 0 14px #f0c040, 0 0 28px rgba(240,192,64,.5); }
      100% { background-position: 0  200%; box-shadow: none; }
    }

    /* ═══ TOP-CENTER UI ═══ */
    #ui-top {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 30;
      display: flex; flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 14px) 16px 0;
      gap: 8px;
      pointer-events: none;
    }
    .pill {
      background: rgba(6,5,15,.78);
      border: 1px solid rgba(240,192,64,.28);
      border-radius: 999px;
      padding: 9px 22px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align: center;
      pointer-events: auto;
    }
    #loading-pill { font-size: .88em; color: #f0c040; letter-spacing: .04em; }

    #title-pill { display: none; }
    .game-title-sm {
      font-size: 1.1em;
      background: linear-gradient(90deg, #f0c040, #e8830a, #f0c040);
      background-size: 200%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }

    #hud { display: none; flex-direction: column; align-items: center; gap: 6px; width: min(90vw, 340px); }
    #progress-track {
      width: 100%; height: 10px;
      background: rgba(255,255,255,.12);
      border-radius: 999px; overflow: hidden;
    }
    #progress-fill {
      height: 100%; width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #e83060, #f0c040);
      transition: width .12s ease;
      box-shadow: 0 0 8px rgba(240,192,64,.5);
    }
    #status-text {
      font-size: .82em; color: rgba(255,255,255,.85);
      text-shadow: 0 1px 5px rgba(0,0,0,.9);
      text-align: center;
    }

    /* ═══ START OVERLAY (bottom-center) ═══ */
    #start-overlay {
      position: fixed; inset: 0; z-index: 25;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 10vh);
      background: linear-gradient(to top, rgba(0,0,0,.6) 0%, transparent 55%);
      pointer-events: none;
    }
    #start-overlay .inner {
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      pointer-events: auto;
    }
    #start-subtitle {
      font-size: .84em; color: rgba(255,255,255,.65);
      text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.9);
    }

    /* ═══ BUTTONS ═══ */
    .btn {
      padding: 14px 44px; border: none; border-radius: 999px;
      cursor: pointer; font-size: 1.1em;
      font-family: inherit; font-weight: bold;
      transition: transform .15s, box-shadow .15s; outline: none;
    }
    .btn:hover  { transform: scale(1.06); }
    .btn:active { transform: scale(.96); }
    .btn-gold {
      background: linear-gradient(135deg, #f0c040, #e8830a);
      color: #1a0800;
      box-shadow: 0 6px 28px rgba(240,192,64,.55);
    }
    .btn-gold:hover { box-shadow: 0 8px 36px rgba(240,192,64,.8); }

    /* ═══ WIN ═══ */
    #win-canvas {
      position: fixed; inset: 0; z-index: 40;
      width: 100%; height: 100%;
      display: block;
    }
    #win-msg-wrap {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; justify-content: center;
      padding: max(env(safe-area-inset-top,14px),18px) 16px 0;
    }
    #win-msg {
      background: rgba(6,5,15,.84);
      border: 1px solid rgba(240,192,64,.45);
      border-radius: 20px;
      padding: 18px 26px;
      text-align: center;
      font-size: 1.15em; line-height: 1.7;
      color: #f0c040;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      max-width: 340px;
      animation: glowBox 1.7s ease-in-out infinite alternate;
    }
    @keyframes glowBox {
      from { box-shadow: 0 0 18px rgba(240,192,64,.25), 0 4px 24px rgba(0,0,0,.6); }
      to   { box-shadow: 0 0 44px rgba(240,192,64,.7),  0 4px 24px rgba(0,0,0,.6); }
    }
    #again-wrap {
      position: fixed; z-index: 50;
      bottom: max(env(safe-area-inset-bottom,0px), 10vh);
      left: 0; right: 0;
      display: flex; justify-content: center;
    }

    /* ═══ PARTICLES ═══ */
    .spark {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 60;
      animation: sparkFly linear forwards;
    }
    @keyframes sparkFly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(0); }
    }

    .hidden { display: none !important; }

    /* ═══ SETTINGS BUTTON (top-right) ═══ */
    #settings-btn {
      position: fixed;
      top: max(env(safe-area-inset-top, 12px), 12px);
      right: 14px;
      z-index: 35;
      width: 42px; height: 42px;
      border: 1px solid rgba(240,192,64,.30);
      border-radius: 50%;
      background: rgba(6,5,15,.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: rgba(240,192,64,.85);
      transition: transform .25s, background .2s, border-color .2s;
    }
    #settings-btn:hover {
      transform: rotate(35deg) scale(1.1);
      background: rgba(24,16,48,.92);
      border-color: rgba(240,192,64,.65);
    }
    #settings-btn:active { transform: scale(.88); }
    #settings-btn svg { pointer-events: none; }

    /* ═══ BOTTOM TOAST ═══ */
    #toast-bottom {
      position: fixed;
      bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(72px);
      z-index: 36;
      padding: 11px 26px;
      border-radius: 999px;
      font-size: .88em; letter-spacing: .03em;
      background: rgba(6,5,15,.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: transform .38s cubic-bezier(.34,1.56,.64,1), opacity .3s;
    }
    #toast-bottom.show   { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast-bottom.success{ border: 1px solid rgba(80,255,130,.45); color: #80ffaa; }
    #toast-bottom.error  { border: 1px solid rgba(255,100,80,.45);  color: #ff9070; }
    #toast-bottom.info   { border: 1px solid rgba(240,192,64,.35);  color: #f0c040; }
  </style>
</head>
<body>

<!-- ═══ GAME CONTAINER ═══ -->
<div id="game-container">
  <video id="webcam-video" autoplay muted playsinline></video>
  <canvas id="portrait-canvas"></canvas>
  <canvas id="guide-canvas"></canvas>
</div>

<!-- ═══ 4-EDGE LOADING BORDER ═══ -->
<div class="edge-loader" id="edge-top"></div>
<div class="edge-loader" id="edge-bottom"></div>
<div class="edge-loader" id="edge-left"></div>
<div class="edge-loader" id="edge-right"></div>

<!-- ═══ TOP-CENTER UI ═══ -->
<div id="ui-top">
  <div class="pill" id="loading-pill">Đang triệu hồi phép thuật… ✨</div>

<!-- ═══ START OVERLAY ═══ -->

</div>

<!-- ═══ SETTINGS BUTTON + FILE INPUT ═══ -->
<button id="settings-btn" title="Đổi hình nhân vật">
  <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">

      3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.34.07-.69.07-1.08s-.03-.73-.07-1.08l2.32-1.8
      c.21-.16.27-.46.13-.7l-2.2-3.81c-.14-.24-.43-.32-.67-.24l-2.73 1.1c-.57-.44-1.18-.8

</button>
<input id="img-upload" type="file" accept="image/*" style="display:none">

<!-- ═══ BOTTOM TOAST ═══ -->
<div id="toast-bottom"></div>

<canvas id="proc-canvas" style="display:none"></canvas>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════
const MODEL_URL    = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model';
const PORTRAIT_SRC = './Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg';
let   CHARACTER    = 'Mona Lisa';

// Hole fractions – overwritten by calibrateHole() after face-api detects landmarks
// in the portrait itself.  Fallback values tuned for the 1920×2861 Mona Lisa image:
// nose tip ≈ 30 % down, mouth ≈ 35 % down, face center ≈ 47 % from left.
let HOLE_XF    = 0.360;
let HOLE_YF    = 0.292;
let HOLE_WF    = 0.195;
let HOLE_HF    = 0.085;
let NOSE_IN_H  = 0.30;
let MOUTH_IN_H = 0.72;

const TOLERANCE_F = 0.30;  // alignment tolerance as fraction of hole.w
const BUFFER_SIZE = 50;    // ~5.5 s at 110 ms/frame
const WIN_THRESH  = 0.80;  // product score needed (≈ both individually ≥ 89 %)

// ═══════════════════════════════════════════════════════
//  ELEMENTS
// ═══════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const videoEl      = $('webcam-video');
const pCanvas      = $('portrait-canvas');
const gCanvas      = $('guide-canvas');
const procCanvas   = $('proc-canvas');
const winCanvas    = $('win-canvas');
const progressFill = $('progress-fill');
const statusText   = $('status-text');
const winMsg       = $('win-msg');

const pCtx    = pCanvas.getContext('2d');
const gCtx    = gCanvas.getContext('2d');
const procCtx = procCanvas.getContext('2d');
const winCtx  = winCanvas.getContext('2d');

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let portrait    = null;          // Image element after blob load
let imgNW       = 402;
let imgNH       = 602;           // updated when real image loads
let hole        = {};
let mediaStream = null;
let detecting   = false;
let winDone     = false;
let alignBuf    = [];
let detectTimer = null;
let guideRAF    = null;
let modelsReady = false;

// ═══════════════════════════════════════════════════════
//  RESIZE + GEOMETRY
// ═══════════════════════════════════════════════════════
function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  [pCanvas, gCanvas, procCanvas, winCanvas].forEach(c => { c.width = W; c.height = H; });
  computeHole();
}

// CSS object-fit:cover equivalent for canvas
function coverXform(cw, ch) {
  const s  = Math.max(cw / imgNW, ch / imgNH);
  const ox = (cw - imgNW * s) / 2;
  const oy = (ch - imgNH * s) / 2;
  return { s, ox, oy };
}

function computeHole() {
  const { s, ox, oy } = coverXform(pCanvas.width, pCanvas.height);
  hole.x  = HOLE_XF * imgNW * s + ox;
  hole.y  = HOLE_YF * imgNH * s + oy;
  hole.w  = HOLE_WF * imgNW * s;
  hole.h  = HOLE_HF * imgNH * s;
  hole.cx = hole.x + hole.w / 2;
  hole.cy = hole.y + hole.h / 2;
  hole.noseTgt  = { x: hole.cx, y: hole.y + hole.h * NOSE_IN_H  };
  hole.mouthTgt = { x: hole.cx, y: hole.y + hole.h * MOUTH_IN_H };
  hole.tol = hole.w * TOLERANCE_F;
}

// ═══════════════════════════════════════════════════════
//  AUTO-CALIBRATE HOLE FROM PORTRAIT FACE DETECTION
// ═══════════════════════════════════════════════════════
async function calibrateHole() {
  if (!portrait) return false;
  try {
    const det = await faceapi
      .detectSingleFace(portrait,
        new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.15 }))
      .withFaceLandmarks(true);

    if (!det) { console.log('calibrateHole: no face detected in portrait, using fallback'); return false; }

    const pts    = det.landmarks.positions;
    // 68-point model indices:
    // 30 = nose tip, 31/35 = nose base left/right
    // 48/54 = mouth corners, 51 = top lip, 57 = bottom lip
    const noseTip = pts[30];
    const noseL   = pts[31], noseR = pts[35];
    const mouthL  = pts[48], mouthR = pts[54];
    const lipTop  = pts[51], lipBot = pts[57];

    const nW = noseR.x - noseL.x;
    const hx = Math.min(noseL.x, mouthL.x)  - nW * 0.70;
    const hy = noseTip.y                     - nW * 0.40;
    const hw = Math.max(noseR.x, mouthR.x)  + nW * 0.70 - hx;
    const hh = lipBot.y                      + nW * 0.50 - hy;

    HOLE_XF    = hx / imgNW;
    HOLE_YF    = hy / imgNH;
    HOLE_WF    = hw / imgNW;
    HOLE_HF    = hh / imgNH;
    NOSE_IN_H  = (noseTip.y              - hy) / hh;
    MOUTH_IN_H = ((lipTop.y + lipBot.y) / 2 - hy) / hh;

    computeHole();
    drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
    console.log('Hole auto-calibrated from portrait:', { HOLE_XF, HOLE_YF, HOLE_WF, HOLE_HF });
    return true;
  } catch(e) {
    console.warn('calibrateHole error:', e);
    return false;
  }
}

// ═══════════════════════════════════════════════════════
//  DRAW PORTRAIT + HOLE
// ═══════════════════════════════════════════════════════
function rrPath(ctx, x, y, w, h, r) {
  r = r || 10;
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
  ctx.arcTo(x+w, y, x+w, y+r, r); ctx.lineTo(x+w, y+h-r);
  ctx.arcTo(x+w, y+h, x+w-r, y+h, r); ctx.lineTo(x+r, y+h);
  ctx.arcTo(x, y+h, x, y+h-r, r); ctx.lineTo(x, y+r);
  ctx.arcTo(x, y, x+r, y, r); ctx.closePath();
}

function drawPortraitLayer(ctx, cw, ch) {
  ctx.clearRect(0, 0, cw, ch);
  if (portrait && portrait.complete && portrait.naturalWidth > 0) {
    const { s, ox, oy } = coverXform(cw, ch);
    try { ctx.drawImage(portrait, ox, oy, imgNW * s, imgNH * s); return; }
    catch (_) {}
  }
  drawFallback(ctx, cw, ch);
}

function punchHole(ctx) {
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'black';
  rrPath(ctx, hole.x, hole.y, hole.w, hole.h);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = 'rgba(240,192,64,.95)';
  ctx.lineWidth   = 2.5;
  ctx.shadowColor = '#f0c040'; ctx.shadowBlur = 16;
  rrPath(ctx, hole.x, hole.y, hole.w, hole.h);
  ctx.stroke();
  ctx.restore();
}

function drawPortraitWithHole(ctx, cw, ch) {
  drawPortraitLayer(ctx, cw, ch);
  punchHole(ctx);
}

// ═══════════════════════════════════════════════════════
//  CANVAS-DRAWN FALLBACK PORTRAIT (always visible, no network)
// ═══════════════════════════════════════════════════════
function drawFallback(ctx, cw, ch) {
  const { s, ox, oy } = coverXform(cw, ch);
  ctx.save();
  ctx.translate(ox, oy); ctx.scale(s, s);
  _fallbackAt402x602(ctx);
  ctx.restore();
}

function _fallbackAt402x602(ctx) {
  const W = 402, H = 602;

  // ── Background ──
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#524128'); bg.addColorStop(.45, '#6a4e2c'); bg.addColorStop(1, '#2a1a08');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Landscape hills
  ctx.fillStyle = '#3d5a48';
  ctx.beginPath(); ctx.moveTo(0,290); ctx.quadraticCurveTo(60,140,130,220); ctx.lineTo(130,H); ctx.lineTo(0,H); ctx.fill();
  ctx.fillStyle = '#2d4a38';
  ctx.beginPath(); ctx.moveTo(W,310); ctx.quadraticCurveTo(345,150,275,225); ctx.lineTo(275,H); ctx.lineTo(W,H); ctx.fill();
  const sky = ctx.createLinearGradient(0,0,0,220);
  sky.addColorStop(0,'rgba(50,75,90,.7)'); sky.addColorStop(1,'rgba(50,75,90,0)');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,220);

  // ── Dress / body ──
  ctx.fillStyle = '#2c3320';
  ctx.beginPath();
  ctx.moveTo(0,H); ctx.lineTo(W,H); ctx.lineTo(380,385);
  ctx.bezierCurveTo(330,325,265,328,235,375);
  ctx.bezierCurveTo(225,402,200,402,168,375);
  ctx.bezierCurveTo(140,328, 75,325, 25,385);
  ctx.closePath(); ctx.fill();

  // Dress folds
  ctx.strokeStyle = 'rgba(100,90,60,.35)'; ctx.lineWidth = 1.5;
  [[0.18,0.72,0.16,1.0],[0.42,0.70,0.40,1.0],[0.62,0.70,0.64,1.0]].forEach(([x1,y1,x2,y2]) => {
    ctx.beginPath(); ctx.moveTo(W*x1,H*y1); ctx.lineTo(W*x2,H*y2); ctx.stroke();
  });

  // ── Neck ──
  ctx.fillStyle = '#c09060';
  ctx.beginPath(); ctx.ellipse(201,388,26,34,0,0,Math.PI*2); ctx.fill();

  // ── Face oval centred at (201, 214) ──
  ctx.fillStyle = '#c09060';
  ctx.beginPath(); ctx.ellipse(201,214,84,130,0,0,Math.PI*2); ctx.fill();
  const fsh = ctx.createRadialGradient(201,214,34,201,214,88);
  fsh.addColorStop(0,'rgba(0,0,0,0)'); fsh.addColorStop(1,'rgba(0,0,0,.22)');
  ctx.fillStyle = fsh;
  ctx.beginPath(); ctx.ellipse(201,214,84,130,0,0,Math.PI*2); ctx.fill();

  // Chin patch below hole (hole bottom ≈ (HOLE_YF+HOLE_HF)*602 ≈ 308)
  ctx.fillStyle = '#c09060';
  ctx.beginPath(); ctx.ellipse(201,332,38,20,0,0,Math.PI*2); ctx.fill();

  // ── Hair ──
  ctx.fillStyle = '#221208';
  ctx.beginPath();
  ctx.moveTo(118,190); ctx.bezierCurveTo(68,160,55,270,65,355);
  ctx.bezierCurveTo(82,400,125,385,148,340); ctx.bezierCurveTo(135,290,124,235,118,190); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(285,190); ctx.bezierCurveTo(338,160,350,270,340,355);
  ctx.bezierCurveTo(322,400,278,385,256,340); ctx.bezierCurveTo(270,290,280,235,285,190); ctx.fill();
  ctx.fillStyle = '#1a0e06';
  ctx.beginPath(); ctx.ellipse(201,105,88,70,0,0,Math.PI*2); ctx.fill();

  // ── Eyes (safely above hole; hole top ≈ HOLE_YF*602 ≈ 209) ──
  // Eyes at y ≈ 163
  function eye(ex, ey) {
    ctx.fillStyle = '#d4a878'; ctx.beginPath(); ctx.ellipse(ex,ey,20,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4a3215'; ctx.beginPath(); ctx.ellipse(ex,ey,10,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#14080a'; ctx.beginPath(); ctx.ellipse(ex,ey,4,5,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(ex,ey-1,20,7,0,Math.PI,0); ctx.stroke();
  }
  eye(168,163); eye(234,163);

  // Faint brows
  ctx.strokeStyle = 'rgba(55,32,10,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(145,148); ctx.quadraticCurveTo(168,143,188,148); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(214,148); ctx.quadraticCurveTo(234,143,258,148); ctx.stroke();

  // Label
  ctx.fillStyle = 'rgba(225,185,72,.82)';
  ctx.font = 'bold 22px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('MONA LISA', 201, 594);

  // Vignette
  const vig = ctx.createRadialGradient(201,301,100,201,301,260);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);
}

// ═══════════════════════════════════════════════════════
//  GUIDE OVERLAY
// ═══════════════════════════════════════════════════════
function drawGuide(nosePos, mouthPos, nOk, mOk, noFace) {
  gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
  const pulse = .5 + .5 * Math.sin(Date.now() / 380);

  function crosshair(x, y, ok) {
    const col = ok ? `rgba(80,255,80,${.6+.4*pulse})` : `rgba(240,192,64,${.45+.45*pulse})`;
    gCtx.save();
    gCtx.strokeStyle = col; gCtx.lineWidth = 2;
    gCtx.shadowColor = ok ? '#80ff80' : '#f0c040';
    gCtx.shadowBlur  = ok ? 16 : 10;
    gCtx.beginPath(); gCtx.arc(x, y, 9, 0, Math.PI*2); gCtx.stroke();
    gCtx.beginPath();
    [[-18,-15],[-14,-19],[14,-19],[18,-15],[18,15],[14,19],[-14,19],[-18,15]]
      .forEach(([dx,dy],i) => { if(i%2===0) gCtx.moveTo(x+dx,y+dy); else gCtx.lineTo(x+dx,y+dy); });
    gCtx.stroke();
    gCtx.restore();
  }

  crosshair(hole.noseTgt.x, hole.noseTgt.y, nOk);
  crosshair(hole.mouthTgt.x, hole.mouthTgt.y, mOk);

  if (!noFace) {
    const dot = (pos, ok) => {
      if (!pos) return;
      gCtx.save();
      gCtx.beginPath(); gCtx.arc(pos.x, pos.y, 6, 0, Math.PI*2);
      gCtx.fillStyle   = ok ? 'rgba(80,255,80,.88)' : 'rgba(255,70,70,.78)';
      gCtx.shadowColor = ok ? '#80ff80' : '#ff4646'; gCtx.shadowBlur = 12;
      gCtx.fill(); gCtx.restore();
    };
    dot(nosePos, nOk); dot(mouthPos, mOk);

    if (nOk && mOk) {
      gCtx.save();
      gCtx.strokeStyle = `rgba(80,255,80,${.4+.6*pulse})`;
      gCtx.lineWidth = 3.5; gCtx.shadowColor = '#80ff80'; gCtx.shadowBlur = 24;
      rrPath(gCtx, hole.x+4, hole.y+4, hole.w-8, hole.h-8, 9);
      gCtx.stroke(); gCtx.restore();
    }
  }
}

// ═══════════════════════════════════════════════════════
//  FACE DETECTION
// ═══════════════════════════════════════════════════════
async function detect() {
  if (!detecting || winDone) return;
  const PW = procCanvas.width, PH = procCanvas.height;

  procCtx.save();
  procCtx.translate(PW, 0); procCtx.scale(-1, 1);
  procCtx.drawImage(videoEl, 0, 0, PW, PH);
  procCtx.restore();

  try {
    const det = await faceapi
      .detectSingleFace(procCanvas, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.35 }))
      .withFaceLandmarks(true);

    if (!det) {
      drawGuide(null, null, false, false, true);
      push(0); setProgress(avg());
      statusText.textContent = '👆 Di chuyển mặt vào ô vàng…';
      return;
    }

    const pts      = det.landmarks.positions;
    const nosePos  = pts[30];
    const mouthPos = { x:(pts[48].x+pts[54].x)/2, y:(pts[51].y+pts[57].y)/2 };

    const nd  = dist(nosePos,  hole.noseTgt);
    const md  = dist(mouthPos, hole.mouthTgt);
    const nOk = nd < hole.tol;
    const mOk = md < hole.tol;

    drawGuide(nosePos, mouthPos, nOk, mOk, false);
    // product: both nose AND mouth must be aligned; one misaligned drags score down fast
    push(sc(nd) * sc(md));
    const a = avg();
    setProgress(a);

    statusText.textContent =
      nOk && mOk ? '🎯 Giữ nguyên…' :
      nOk || mOk ? '📐 Gần rồi! Điều chỉnh thêm' :
                   '👆 Di chuyển mặt vào ô vàng…';

    // require rolling average + last 8 frames all individually above floor
    const streak = alignBuf.slice(-8).every(v => v >= 0.55);
    if (a >= WIN_THRESH && alignBuf.length >= Math.floor(BUFFER_SIZE*.85) && streak) triggerWin();
  } catch (_) {}
}

const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const sc   = d    => Math.max(0, 1 - d/(hole.tol*2.5));
const push = v    => { alignBuf.push(v); if(alignBuf.length>BUFFER_SIZE) alignBuf.shift(); };
const avg  = ()   => alignBuf.length ? alignBuf.reduce((a,b)=>a+b,0)/alignBuf.length : 0;
const setProgress = f => { progressFill.style.width = Math.min(100,f*100)+'%'; };

// ═══════════════════════════════════════════════════════
//  GUIDE ANIMATION LOOP (redraws portrait+hole every frame)
// ═══════════════════════════════════════════════════════
function guideLoop() {
  if (!detecting) return;
  drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
  guideRAF = requestAnimationFrame(guideLoop);
}

// ═══════════════════════════════════════════════════════
//  WIN SEQUENCE
// ═══════════════════════════════════════════════════════
async function triggerWin() {
  if (winDone) return;
  winDone = true; detecting = false;
  clearInterval(detectTimer); cancelAnimationFrame(guideRAF);

  // Freeze mirrored camera frame
  const frozen  = document.createElement('canvas');
  frozen.width  = pCanvas.width; frozen.height = pCanvas.height;
  const fCtx    = frozen.getContext('2d');
  fCtx.save(); fCtx.translate(frozen.width,0); fCtx.scale(-1,1);
  fCtx.drawImage(videoEl, 0, 0, frozen.width, frozen.height); fCtx.restore();

  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

  // Show fullscreen win canvas
  winCanvas.width  = pCanvas.width; winCanvas.height = pCanvas.height;
  winCanvas.classList.remove('hidden');

  await animateReveal(frozen);
}

async function animateReveal(frozen) {
  const CW = winCanvas.width, CH = winCanvas.height;
  spawnSparks(40); await sleep(260);

  const STEPS = 50;
  for (let i = 0; i <= STEPS; i++) {
    const t = eio(i/STEPS);
    winCtx.clearRect(0,0,CW,CH);
    drawPortraitLayer(winCtx, CW, CH);          // full portrait, NO hole

    // Frozen face dissolves out of hole area
    const fα = Math.max(0, 1-t*1.5);
    if (fα > 0) {
      winCtx.save(); winCtx.globalAlpha = fα;
      winCtx.drawImage(frozen, hole.x,hole.y,hole.w,hole.h, hole.x,hole.y,hole.w,hole.h);
      winCtx.restore();
    }
    // Golden shimmer fills the hole region
    if (t > 0.2) {
      const sα = Math.min(1,(t-.2)/.55) * .6;
      winCtx.save();
      const g = winCtx.createRadialGradient(hole.cx,hole.cy,0, hole.cx,hole.cy,hole.w*.7);
      g.addColorStop(0,`rgba(255,230,100,${sα})`); g.addColorStop(1,'rgba(240,100,20,0)');
      winCtx.fillStyle = g;
      rrPath(winCtx, hole.x,hole.y,hole.w,hole.h);
      winCtx.fill(); winCtx.restore();
    }
    if (i%6===0) spawnSparks(5);
    await sleep(20);
  }

  // Final: clean full portrait + subtle gold veil
  winCtx.clearRect(0,0,CW,CH);
  drawPortraitLayer(winCtx, CW, CH);
  winCtx.save(); winCtx.globalAlpha = .1; winCtx.fillStyle = '#f0c040';
  winCtx.fillRect(0,0,CW,CH); winCtx.restore();

  spawnSparks(60);
  await sleep(300);

  winMsg.innerHTML =
    `😱 Ôi trời! Bạn có thật là<br>` +
    `<span style="color:gold;font-style:italic;font-size:1.1em">${CHARACTER}</span><br>không vậy?!<br>` +
    `<span style="font-size:.75em;color:rgba(255,220,80,.8)">✨ Nụ cười bí ẩn đó… chính là của bạn!</span><br>` +
    `<span style="font-size:.7em;color:rgba(255,200,60,.65)">🎨 Leonardo đã vẽ bạn từ 500 năm trước!</span>`;
  $('win-msg-wrap').classList.remove('hidden');
  $('again-wrap').classList.remove('hidden');

  for (let i=0; i<4; i++) { await sleep(350); spawnSparks(22); }
}

// ═══════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════
const SPARK_COLORS = ['#f0c040','#ff6b6b','#6bdcff','#c040f0','#40ff90','#fff','#ffa040','#ff40a0'];

function spawnSparks(n) {
  const cx = innerWidth/2, cy = innerHeight/2;
  for (let i=0; i<n; i++) {
    const el  = document.createElement('div');
    el.className = 'spark';
    const sz  = 5 + Math.random()*9;
    const ang = Math.random()*Math.PI*2;
    const rad = 80 + Math.random()*Math.max(innerWidth,innerHeight)*.55;
    const dur = .9 + Math.random()*1.3;
    Object.assign(el.style, {
      left:   (cx+(Math.random()-.5)*innerWidth*.8)+'px',
      top:    (cy+(Math.random()-.5)*innerHeight*.5)+'px',
      width:  sz+'px', height: sz+'px',
      background: SPARK_COLORS[Math.random()*SPARK_COLORS.length|0],
      '--tx': (Math.cos(ang)*rad)+'px',
      '--ty': (Math.sin(ang)*rad - 60 - Math.random()*140)+'px',
      animationDuration: dur+'s',
      animationDelay: (Math.random()*.25)+'s',
    });
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), (dur+.25)*1000+250);
  }
}

const eio   = t => t<.5 ? 2*t*t : -1+(4-2*t)*t;
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// ═══════════════════════════════════════════════════════
//  LOADING EDGE BORDER
// ═══════════════════════════════════════════════════════
function showEdges(on) {
  ['edge-top','edge-bottom','edge-left','edge-right']
    .forEach(id => $(id).classList.toggle('active', on));
}

// ═══════════════════════════════════════════════════════
//  START GAME
// ═══════════════════════════════════════════════════════
async function startGame() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'user', width:{ideal:1280}, height:{ideal:720} }
    });
    videoEl.srcObject = mediaStream;
    await new Promise(r => { videoEl.onloadedmetadata = r; });
    await videoEl.play();
  } catch(e) {
    alert('Không thể truy cập camera 😢\n'+e.message);
    return;
  }

  winDone = false; detecting = false;
  alignBuf = [];
  progressFill.style.width = '0%';
  statusText.textContent = '👆 Di chuyển mặt vào ô vàng…';
  winMsg.innerHTML = '';

  $('start-overlay').classList.add('hidden');
  $('win-msg-wrap').classList.add('hidden');
  $('again-wrap').classList.add('hidden');
  winCanvas.classList.add('hidden');

  $('title-pill').style.display = 'block';
  $('hud').style.display = 'flex';

  detecting = true;
  guideLoop();
  detectTimer = setInterval(detect, 110);
}

// ═══════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════
async function boot() {
  resize();
  window.addEventListener('resize', () => {
    resize();
    if (!detecting) drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
  });

  // Draw fallback immediately (dark canvas not blank)
  drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
  showEdges(true);

  // 1 · Load portrait via fetch → blob URL (same-origin, no canvas CORS issues)
  $('loading-pill').textContent = 'Đang tải chân dung huyền bí… 🖼️';
  try {
    const resp = await fetch(PORTRAIT_SRC);
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const blob = await resp.blob();
    portrait = new Image();
    portrait.src = URL.createObjectURL(blob);
    await new Promise((res,rej) => { portrait.onload=res; portrait.onerror=rej; });
    imgNW = portrait.naturalWidth  || 402;
    imgNH = portrait.naturalHeight || 602;
    computeHole();
    drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height); // upgrade to real image
  } catch(e) {
    console.warn('Portrait fetch failed, using canvas fallback:', e.message);
    portrait = null;
  }

  // 2 · Load AI models
  $('loading-pill').textContent = 'Đang nạp trí tuệ nhân tạo… 🤖';
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
  } catch(e) {
    throw new Error('Không tải được AI model. Kiểm tra kết nối mạng.\n'+e.message);
  }

  modelsReady = true;

  // 3 · Auto-calibrate hole position by detecting face landmarks in portrait
  $('loading-pill').textContent = 'Đang căn chỉnh vị trí mũi miệng… 🎯';
  await calibrateHole();

  // 4 · Ready
  showEdges(false);
  $('loading-pill').classList.add('hidden');
  $('start-overlay').classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════
//  TOAST (bottom-center)
// ═══════════════════════════════════════════════════════
let _toastTimer = null;
function showToast(msg, type = 'info', ms = 3200) {
  const el = $('toast-bottom');
  el.textContent = msg;
  el.className   = `show ${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = type; }, ms);
}

// ═══════════════════════════════════════════════════════
//  SETTINGS – CUSTOM IMAGE UPLOAD
// ═══════════════════════════════════════════════════════
$('settings-btn').addEventListener('click', () => {
  if (detecting) {
    // Stop current game, go back to start
    detecting = false;
    clearInterval(detectTimer);
    cancelAnimationFrame(guideRAF);
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    winDone = false; alignBuf = [];
    $('hud').style.display = 'none';
    $('title-pill').style.display = 'none';
    $('loading-pill').classList.add('hidden');
  }
  $('img-upload').value = '';
  $('img-upload').click();
});

$('img-upload').addEventListener('change', async function () {
  const file = this.files[0];
  if (!file) return;

  // Derive character name from filename
  CHARACTER = file.name
    .replace(/\.[^.]+$/, '')
    .replace(/[_\-\.]+/g, ' ')
    .trim()
    .replace(/\b\w/g, c => c.toUpperCase()) || 'Nhân Vật Bí Ẩn';

  showToast('⏳ Đang tải hình…', 'info', 60000);

  // Load image from local file (blob URL = same-origin, no CORS issue)
  try {
    const url = URL.createObjectURL(file);
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    portrait = img;
    imgNW    = img.naturalWidth;
    imgNH    = img.naturalHeight;
    // Reset hole to fallback fractions before calibration
    HOLE_XF = 0.360; HOLE_YF = 0.292; HOLE_WF = 0.195; HOLE_HF = 0.085;
    NOSE_IN_H = 0.30; MOUTH_IN_H = 0.72;
    computeHole();
    drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
  } catch (e) {
    showToast('❌ Không tải được hình', 'error');
    return;
  }

  // Auto-calibrate if models are ready
  if (modelsReady) {
    showToast('🔍 Đang xác định vị trí mũi miệng…', 'info', 60000);
    const ok = await calibrateHole();
    showToast(
      ok ? '✅ Đã xác định vị trí mũi miệng!' : '⚠️ Không nhận ra khuôn mặt — dùng vị trí mặc định',
      ok ? 'success' : 'error'
    );
  } else {
    showToast('✅ Hình đã tải! (AI đang nạp, tự căn chỉnh sau…)', 'success');
  }

  // Ensure we're at the start screen
  $('win-msg-wrap').classList.add('hidden');
  $('again-wrap').classList.add('hidden');
  winCanvas.classList.add('hidden');
  $('loading-pill').classList.add('hidden');
  $('start-overlay').classList.remove('hidden');
});

// ═══════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════
$('start-btn').addEventListener('click', startGame);

$('again-btn').addEventListener('click', () => {
  $('win-msg-wrap').classList.add('hidden');
  $('again-wrap').classList.add('hidden');
  winCanvas.classList.add('hidden');
  $('title-pill').style.display = 'none';
  $('hud').style.display = 'none';
  $('loading-pill').classList.remove('hidden');
  $('loading-pill').textContent = '✨ Sẵn sàng chơi lại!';
  setTimeout(() => {
    $('loading-pill').classList.add('hidden');
    drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
    $('start-overlay').classList.remove('hidden');
  }, 600);
});

// ═══════════════════════════════════════════════════════
//  GO
// ═══════════════════════════════════════════════════════
boot().catch(err => {
  console.error('Boot error:', err);
  showEdges(false);
  $('loading-pill').textContent = '❌ ' + err.message;
  $('loading-pill').style.color = '#ff8080';
});
</script>
