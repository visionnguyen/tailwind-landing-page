<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎭 Bạn Là Ai?</title>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Georgia', serif; color: #fff; }

    /* ═══ FULL-SCREEN GAME CONTAINER ═══ */
    #game-container { position: fixed; inset: 0; width: 100vw; height: 100vh; }

    #webcam-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #portrait-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 2;
    }
    #guide-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* ═══ 4-EDGE LOADING BORDER ═══ */
    .edge-loader {
      position: fixed; z-index: 20; pointer-events: none;
      opacity: 0; transition: opacity .3s;
    }
    .edge-loader.active { opacity: 1; }

    #edge-top, #edge-bottom {
      left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg,
        transparent 0%, transparent 30%,
        #f0c040 48%, #fff 50%, #f0c040 52%,
        transparent 70%, transparent 100%);
      background-size: 300% 100%;
    }
    #edge-left, #edge-right {
      top: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg,
        transparent 0%, transparent 30%,
        #f0c040 48%, #fff 50%, #f0c040 52%,
        transparent 70%, transparent 100%);
      background-size: 100% 300%;
    }
    #edge-top    { top: 0;    animation: sweepH 1.6s linear infinite; }
    #edge-bottom { bottom: 0; animation: sweepH 1.6s linear infinite reverse; }
    #edge-left   { left: 0;   animation: sweepV 1.6s linear infinite 0.4s; }
    #edge-right  { right: 0;  animation: sweepV 1.6s linear infinite reverse 0.4s; }

    @keyframes sweepH {
      0%   { background-position: -100% 0;  box-shadow: none; }
      50%  { box-shadow: 0 0 14px #f0c040, 0 0 28px rgba(240,192,64,.5); }
      100% { background-position:  200% 0;  box-shadow: none; }
    }
    @keyframes sweepV {
      0%   { background-position: 0 -100%; box-shadow: none; }
      50%  { box-shadow: 0 0 14px #f0c040, 0 0 28px rgba(240,192,64,.5); }
      100% { background-position: 0  200%; box-shadow: none; }
    }

    /* ═══ TOP-CENTER UI ═══ */
    #ui-top {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 30;
      display: flex; flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 14px) 16px 0;
      gap: 8px;
      pointer-events: none;
    }
    .pill {
      background: rgba(6,5,15,.78);
      border: 1px solid rgba(240,192,64,.28);
      border-radius: 999px;
      padding: 9px 22px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-align: center;
      pointer-events: auto;
    }
    #loading-pill { font-size: .88em; color: #f0c040; letter-spacing: .04em; }

    #title-pill { display: none; }
    .game-title-sm {
      font-size: 1.1em;
      background: linear-gradient(90deg, #f0c040, #e8830a, #f0c040);
      background-size: 200%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }

    #hud { display: none; flex-direction: column; align-items: center; gap: 6px; width: min(90vw, 340px); }
    #progress-track {
      width: 100%; height: 10px;
      background: rgba(255,255,255,.12);
      border-radius: 999px; overflow: hidden;
    }
    #progress-fill {
      height: 100%; width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #e83060, #f0c040);
      transition: width .12s ease;
      box-shadow: 0 0 8px rgba(240,192,64,.5);
    }
    #status-text {
      font-size: .82em; color: rgba(255,255,255,.85);
      text-shadow: 0 1px 5px rgba(0,0,0,.9);
      text-align: center;
    }

    /* ═══ START OVERLAY (bottom-center) ═══ */
    #start-overlay {
      position: fixed; inset: 0; z-index: 25;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 10vh);
      background: linear-gradient(to top, rgba(0,0,0,.6) 0%, transparent 55%);
      pointer-events: none;
    }
    #start-overlay .inner {
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      pointer-events: auto;
    }
    #start-subtitle {
      font-size: .84em; color: rgba(255,255,255,.65);
      text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.9);
    }

    /* ═══ BUTTONS ═══ */
    .btn {
      padding: 14px 44px; border: none; border-radius: 999px;
      cursor: pointer; font-size: 1.1em;
      font-family: inherit; font-weight: bold;
      transition: transform .15s, box-shadow .15s; outline: none;
    }
    .btn:hover  { transform: scale(1.06); }
    .btn:active { transform: scale(.96); }
    .btn-gold {
      background: linear-gradient(135deg, #f0c040, #e8830a);
      color: #1a0800;
      box-shadow: 0 6px 28px rgba(240,192,64,.55);
    }
    .btn-gold:hover { box-shadow: 0 8px 36px rgba(240,192,64,.8); }

    /* ═══ WIN ═══ */
    #win-canvas {
      position: fixed; inset: 0; z-index: 40;
      width: 100%; height: 100%;
      display: block;
    }
    #win-msg-wrap {
      position: fixed; left: 0; right: 0; z-index: 50;
      bottom: max(env(safe-area-inset-bottom,0px), 150px);
      display: flex; justify-content: center;
      padding: 0 16px;
      pointer-events: none;
    }
    #win-msg {
      background: rgba(6,5,15,.78);
      border: 1px solid rgba(240,192,64,.40);
      border-radius: 14px;
      padding: 8px 16px;
      text-align: center;
      font-size: .88em; line-height: 1.35;
      color: #f0c040;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: 290px;
      animation: glowBox 1.7s ease-in-out infinite alternate;
    }
    @keyframes glowBox {
      from { box-shadow: 0 0 12px rgba(240,192,64,.22), 0 3px 16px rgba(0,0,0,.55); }
      to   { box-shadow: 0 0 30px rgba(240,192,64,.6),  0 3px 16px rgba(0,0,0,.55); }
    }
    #again-wrap {
      position: fixed; z-index: 50;
      bottom: max(env(safe-area-inset-bottom,0px), 88px);
      left: 0; right: 0;
      display: flex; justify-content: center;
    }

    /* ═══ PARTICLES ═══ */
    .spark {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 60;
      animation: sparkFly linear forwards;
    }
    @keyframes sparkFly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(0); }
    }

    .hidden { display: none !important; }

    /* ═══ SETTINGS BUTTON (top-right) ═══ */
    #settings-btn {
      position: fixed;
      top: max(env(safe-area-inset-top, 12px), 12px);
      right: 14px;
      z-index: 35;
      width: 42px; height: 42px;
      border: 1px solid rgba(240,192,64,.30);
      border-radius: 50%;
      background: rgba(6,5,15,.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: rgba(240,192,64,.85);
      transition: transform .25s, background .2s, border-color .2s;
    }
    #settings-btn:hover {
      transform: rotate(35deg) scale(1.1);
      background: rgba(24,16,48,.92);
      border-color: rgba(240,192,64,.65);
    }
    #settings-btn:active { transform: scale(.88); }
    #settings-btn svg { pointer-events: none; }

    /* ═══ BOTTOM TOAST ═══ */
    #toast-bottom {
      position: fixed;
      bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(72px);
      z-index: 36;
      padding: 11px 26px;
      border-radius: 999px;
      font-size: .88em; letter-spacing: .03em;
      background: rgba(6,5,15,.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: transform .38s cubic-bezier(.34,1.56,.64,1), opacity .3s;
    }
    #toast-bottom.show   { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast-bottom.success{ border: 1px solid rgba(80,255,130,.45); color: #80ffaa; }
    #toast-bottom.error  { border: 1px solid rgba(255,100,80,.45);  color: #ff9070; }
    #toast-bottom.info   { border: 1px solid rgba(240,192,64,.35);  color: #f0c040; }

    /* ═══ LEVEL BAR (bottom-fixed, shown on start/win screens) ═══ */
    #level-bar {
      position: fixed;
      bottom: max(env(safe-area-inset-bottom, 0px), 10px);
      left: 0; right: 0;
      z-index: 51;
      display: flex; flex-direction: column;
      align-items: center; gap: 5px;
      padding: 0 12px 4px;
      pointer-events: auto;
    }
    .lv-label {
      font-size: .68em; color: rgba(255,255,255,.32);
      letter-spacing: .07em; text-transform: uppercase;
    }
    .lv-pips { display: flex; gap: 6px; flex-wrap: nowrap; }
    .lv-pip {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 7px 10px; min-width: 52px;
      border: 1px solid rgba(240,192,64,.18);
      border-radius: 12px;
      background: rgba(6,5,15,.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer; color: rgba(255,255,255,.38);
      font-size: .82em; font-family: inherit;
      transition: transform .15s, background .2s, border-color .2s, color .2s;
    }
    .lv-pip span { font-size: .66em; white-space: nowrap; }
    .lv-pip:hover { transform: scale(1.10); background: rgba(24,16,48,.88); }
    .lv-pip.active {
      border-color: rgba(240,192,64,.72);
      color: #f0c040;
      background: rgba(30,18,4,.90);
      box-shadow: 0 0 14px rgba(240,192,64,.32), 0 2px 10px rgba(0,0,0,.5);
    }
    /* Give the start-overlay's inner content more bottom padding so level bar doesn't overlap */
    #start-overlay .inner { padding-bottom: 74px; }
  </style>
</head>
<body>

<!-- ═══ GAME CONTAINER ═══ -->
<div id="game-container">
  <video id="webcam-video" autoplay muted playsinline></video>
  <canvas id="portrait-canvas"></canvas>

</div>

<!-- ═══ 4-EDGE LOADING BORDER ═══ -->
<div class="edge-loader" id="edge-top"></div>

<div id="ui-top">

<!-- ═══ SETTINGS BUTTON + FILE INPUT ═══ -->
<button id="settings-btn" title="Đổi hình nhân vật">
  <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">

      3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.34.07-.69.07-1.08s-.03-.73-.07-1.08l2.32-1.8
      c.21-.16.27-.46.13-.7l-2.2-3.81c-.14-.24-.43-.32-.67-.24l-2.73 1.1c-.57-.44-1.18-.8

      4.46 4.87 4.32 5.11L2.12 8.92C1.98 9.16 2.04 9.46 2.25 9.62L4.57 11.42
      C4.53 11.77 4.5 12.12 4.5 12.5s.03.73.07 1.08l-2.32 1.8c-.21.16-.27.46-.13.7

<input id="img-upload" type="file" accept="image/*" style="display:none">

<!-- ═══ BOTTOM TOAST ═══ -->
<div id="toast-bottom"></div>

<canvas id="proc-canvas" style="display:none"></canvas>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════
const MODEL_URL    = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model';
const PORTRAIT_SRC = './Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg';
let   CHARACTER    = 'Mona Lisa';

// Hole fractions – overwritten by calibrateHole() after face-api detects landmarks
// in the portrait itself.  Fallback values tuned for the 1920×2861 Mona Lisa image:
// nose tip ≈ 30 % down, mouth ≈ 35 % down, face center ≈ 47 % from left.
let HOLE_XF    = 0.360;
let HOLE_YF    = 0.292;
let HOLE_WF    = 0.195;
let HOLE_HF    = 0.085;
let NOSE_IN_H  = 0.30;
let MOUTH_IN_H = 0.72;

// Difficulty levels — scoring parameters and landmark count
const LEVELS = [
  { name:'Dễ',    icon:'🌱', tolF:0.42, winThresh:0.60, bufN:20, scaleMin:0.45, scaleMax:2.20, sFloor:0.45, sLen:5,  useEyes:false, useNoseBridge:false },
  { name:'Vừa',   icon:'⚡', tolF:0.34, winThresh:0.70, bufN:35, scaleMin:0.50, scaleMax:2.00, sFloor:0.48, sLen:6,  useEyes:false, useNoseBridge:false },
  { name:'Khó',   icon:'🔥', tolF:0.28, winThresh:0.80, bufN:50, scaleMin:0.55, scaleMax:1.90, sFloor:0.55, sLen:8,  useEyes:false, useNoseBridge:false },
  { name:'Pro',   icon:'💎', tolF:0.24, winThresh:0.83, bufN:55, scaleMin:0.58, scaleMax:1.75, sFloor:0.58, sLen:8,  useEyes:true,  useNoseBridge:false },
  { name:'Legend',icon:'👑', tolF:0.20, winThresh:0.86, bufN:65, scaleMin:0.60, scaleMax:1.65, sFloor:0.62, sLen:10, useEyes:true,  useNoseBridge:true  },
];
let currentLevel = 2;  // default: Khó 🔥

// 7 landmark targets within the hole (rx/ry in 0..1 hole-local space)
// Order: [noseTip, noseL, noseR, mouthL, mouthR, lipTop, lipBot]
// Landmark indices: pts[30, 31, 35, 48, 54, 51, 57]
const DEFAULT_TARGETS = [
  { rx: 0.50, ry: 0.30 },  // nose tip
  { rx: 0.38, ry: 0.42 },  // left nostril
  { rx: 0.62, ry: 0.42 },  // right nostril
  { rx: 0.25, ry: 0.72 },  // left mouth corner
  { rx: 0.75, ry: 0.72 },  // right mouth corner
  { rx: 0.50, ry: 0.62 },  // top lip center
  { rx: 0.50, ry: 0.84 },  // bottom lip center
];
let holeTargets = DEFAULT_TARGETS.map(t => ({ ...t }));

// Eye + nose-bridge targets in portrait-image fractions (rx/ry ∈ 0..1 of imgNW/imgNH)
// Order: [rightEyeCenter, leftEyeCenter, noseBridge(pts[27])]
// Populated by calibrateHole(); defaults tuned for Mona Lisa 1920×2861
let eyeTargetsFrac = [
  { rx: 0.385, ry: 0.222 },
  { rx: 0.595, ry: 0.222 },
  { rx: 0.498, ry: 0.185 },
];

// ═══════════════════════════════════════════════════════
//  ELEMENTS
// ═══════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const videoEl      = $('webcam-video');
const pCanvas      = $('portrait-canvas');
const gCanvas      = $('guide-canvas');
const procCanvas   = $('proc-canvas');
const winCanvas    = $('win-canvas');
const progressFill = $('progress-fill');
const statusText   = $('status-text');
const winMsg       = $('win-msg');

const pCtx    = pCanvas.getContext('2d');
const gCtx    = gCanvas.getContext('2d');
const procCtx = procCanvas.getContext('2d');
const winCtx  = winCanvas.getContext('2d');

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let portrait    = null;          // Image element after blob load
let imgNW       = 402;
let imgNH       = 602;           // updated when real image loads
let hole        = {};
let mediaStream = null;
let detecting   = false;
let winDone     = false;
let alignBuf    = [];
let detectTimer = null;
let guideRAF    = null;
let modelsReady = false;
let bestScore   = -1;            // highest single-frame alignment score so far
let bestFrame   = null;          // canvas of the best-aligned mirrored frame
let winMagicRAF = null;          // persistent win-screen magic aura loop
let winSparkTimer = null;        // persistent localized spark emitter

// ═══════════════════════════════════════════════════════
//  RESIZE + GEOMETRY
// ═══════════════════════════════════════════════════════
function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  [pCanvas, gCanvas, procCanvas, winCanvas].forEach(c => { c.width = W; c.height = H; });
  computeHole();
}

// CSS object-fit:cover equivalent for canvas
function coverXform(cw, ch) {
  const s  = Math.max(cw / imgNW, ch / imgNH);
  const ox = (cw - imgNW * s) / 2;
  const oy = (ch - imgNH * s) / 2;
  return { s, ox, oy };
}

function computeHole() {
  const { s, ox, oy } = coverXform(pCanvas.width, pCanvas.height);
  hole.x  = HOLE_XF * imgNW * s + ox;
  hole.y  = HOLE_YF * imgNH * s + oy;
  hole.w  = HOLE_WF * imgNW * s;
  hole.h  = HOLE_HF * imgNH * s;
  hole.cx = hole.x + hole.w / 2;
  hole.cy = hole.y + hole.h / 2;
  // 7 screen-space targets derived from holeTargets fractions
  hole.targets = holeTargets.map(t => ({
    x: hole.x + hole.w * t.rx,
    y: hole.y + hole.h * t.ry,
  }));
  // noseTgt / mouthTgt kept for scale-check compatibility
  hole.noseTgt  = hole.targets[0];
  hole.mouthTgt = {
    x: (hole.targets[3].x + hole.targets[4].x) / 2,
    y: (hole.targets[5].y + hole.targets[6].y) / 2,
  };
  hole.tol = hole.w * LEVELS[currentLevel].tolF;
  // Eye + bridge targets in screen coords (outside hole, up in portrait)
  const { s: es, ox: eox, oy: eoy } = coverXform(pCanvas.width, pCanvas.height);
  hole.eyeTargets = eyeTargetsFrac.map(t => ({
    x: t.rx * imgNW * es + eox,
    y: t.ry * imgNH * es + eoy,
  }));
}

// ═══════════════════════════════════════════════════════
//  AUTO-CALIBRATE HOLE FROM PORTRAIT FACE DETECTION
// ═══════════════════════════════════════════════════════
async function calibrateHole() {
  if (!portrait) return false;
  try {
    const det = await faceapi
      .detectSingleFace(portrait,
        new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.15 }))
      .withFaceLandmarks(true);

    if (!det) { console.log('calibrateHole: no face detected in portrait, using fallback'); return false; }

    const pts    = det.landmarks.positions;
    // 68-point model indices:
    // 30 = nose tip, 31/35 = nose base left/right
    // 48/54 = mouth corners, 51 = top lip, 57 = bottom lip
    const noseTip = pts[30];
    const noseL   = pts[31], noseR = pts[35];
    const mouthL  = pts[48], mouthR = pts[54];
    const lipTop  = pts[51], lipBot = pts[57];

    const nW = noseR.x - noseL.x;
    const hx = Math.min(noseL.x, mouthL.x)  - nW * 0.70;
    const hy = noseTip.y                     - nW * 0.40;
    const hw = Math.max(noseR.x, mouthR.x)  + nW * 0.70 - hx;
    const hh = lipBot.y                      + nW * 0.50 - hy;

    HOLE_XF    = hx / imgNW;
    HOLE_YF    = hy / imgNH;
    HOLE_WF    = hw / imgNW;
    HOLE_HF    = hh / imgNH;
    NOSE_IN_H  = (noseTip.y              - hy) / hh;
    MOUTH_IN_H = ((lipTop.y + lipBot.y) / 2 - hy) / hh;

    // Store precise portrait landmark positions as hole-local fractions
    holeTargets = [
      { rx: (noseTip.x - hx) / hw, ry: (noseTip.y - hy) / hh },
      { rx: (noseL.x   - hx) / hw, ry: (noseL.y   - hy) / hh },
      { rx: (noseR.x   - hx) / hw, ry: (noseR.y   - hy) / hh },
      { rx: (mouthL.x  - hx) / hw, ry: (mouthL.y  - hy) / hh },
      { rx: (mouthR.x  - hx) / hw, ry: (mouthR.y  - hy) / hh },
      { rx: (lipTop.x  - hx) / hw, ry: (lipTop.y  - hy) / hh },
      { rx: (lipBot.x  - hx) / hw, ry: (lipBot.y  - hy) / hh },
    ];

    // Eye centers and nose bridge as portrait-image fractions for levels 4-5
    const rEPts = pts.slice(36, 42);
    const lEPts = pts.slice(42, 48);
    const rEC = { x: rEPts.reduce((s,p)=>s+p.x,0)/6, y: rEPts.reduce((s,p)=>s+p.y,0)/6 };
    const lEC = { x: lEPts.reduce((s,p)=>s+p.x,0)/6, y: lEPts.reduce((s,p)=>s+p.y,0)/6 };
    eyeTargetsFrac = [
      { rx: rEC.x / imgNW, ry: rEC.y / imgNH },
      { rx: lEC.x / imgNW, ry: lEC.y / imgNH },
      { rx: pts[27].x / imgNW, ry: pts[27].y / imgNH },
    ];

    computeHole();
    drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
    console.log('Hole auto-calibrated from portrait:', { HOLE_XF, HOLE_YF, HOLE_WF, HOLE_HF });
    return true;
  } catch(e) {
    console.warn('calibrateHole error:', e);
    return false;
  }
}

// ═══════════════════════════════════════════════════════
//  DRAW PORTRAIT + HOLE
// ═══════════════════════════════════════════════════════
function rrPath(ctx, x, y, w, h, r) {
  r = r || 10;
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
  ctx.arcTo(x+w, y, x+w, y+r, r); ctx.lineTo(x+w, y+h-r);
  ctx.arcTo(x+w, y+h, x+w-r, y+h, r); ctx.lineTo(x+r, y+h);
  ctx.arcTo(x, y+h, x, y+h-r, r); ctx.lineTo(x, y+r);
  ctx.arcTo(x, y, x+r, y, r); ctx.closePath();
}

function drawPortraitLayer(ctx, cw, ch) {
  ctx.clearRect(0, 0, cw, ch);
  if (portrait && portrait.complete && portrait.naturalWidth > 0) {
    const { s, ox, oy } = coverXform(cw, ch);
    try { ctx.drawImage(portrait, ox, oy, imgNW * s, imgNH * s); return; }
    catch (_) {}
  }
  drawFallback(ctx, cw, ch);
}

function punchHole(ctx) {
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'black';
  rrPath(ctx, hole.x, hole.y, hole.w, hole.h);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = 'rgba(240,192,64,.95)';
  ctx.lineWidth   = 2.5;
  ctx.shadowColor = '#f0c040'; ctx.shadowBlur = 16;
  rrPath(ctx, hole.x, hole.y, hole.w, hole.h);
  ctx.stroke();
  ctx.restore();
}

function drawPortraitWithHole(ctx, cw, ch) {
  drawPortraitLayer(ctx, cw, ch);
  punchHole(ctx);
}

// ═══════════════════════════════════════════════════════
//  CANVAS-DRAWN FALLBACK PORTRAIT (always visible, no network)

function drawFallback(ctx, cw, ch) {
  const { s, ox, oy } = coverXform(cw, ch);
  ctx.save();
  ctx.translate(ox, oy); ctx.scale(s, s);
  _fallbackAt402x602(ctx);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
//  GUIDE OVERLAY
// ═══════════════════════════════════════════════════════
// drawGuide(playerPts, scores, noFace, showEyes, showBridge)
//   playerPts : array of 7+ {x,y} — null when no face
//   scores    : array of alignment scores 0..1
//   noFace    : true → skip player dots / skeleton
function drawGuide(playerPts, scores, noFace, showEyes, showBridge) {
  gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
  const pulse = .5 + .5 * Math.sin(Date.now() / 380);

  // Per-score color: green (s=1) → gold → red (s=0)
  function scoreColor(s, alpha) {
    const r = Math.round(80  + 175 * (1 - s));
    const g = Math.round(255 - 155 * (1 - s));
    const b = Math.round(80  * s);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  const T = hole.targets;  // 7 screen-space targets

  // ── Target skeleton (always shown) ─────────────────────────────────────────
  function skelLine(a, b, col) {
    gCtx.save(); gCtx.strokeStyle = col; gCtx.lineWidth = 1.4;
    gCtx.setLineDash([4, 5]); gCtx.globalAlpha = 0.55;
    gCtx.shadowColor = col; gCtx.shadowBlur = 6;
    gCtx.beginPath(); gCtx.moveTo(a.x, a.y); gCtx.lineTo(b.x, b.y); gCtx.stroke();
    gCtx.setLineDash([]); gCtx.restore();
  }
  const avgNose  = scores ? (scores[0]+scores[1]+scores[2])/3 : 0.5;
  const avgMouth = scores ? (scores[3]+scores[4]+scores[5]+scores[6])/4 : 0.5;
  const nCol = scoreColor(avgNose,  1);
  const mCol = scoreColor(avgMouth, 1);
  // Nose triangle
  skelLine(T[0], T[1], nCol); skelLine(T[0], T[2], nCol); skelLine(T[1], T[2], nCol);
  // Mouth outline
  skelLine(T[3], T[5], mCol); skelLine(T[5], T[4], mCol);
  skelLine(T[3], T[6], mCol); skelLine(T[6], T[4], mCol);

  // ── Target crosshairs: light "+" cross marks (no round dot) ────────────────
  function crosshair(x, y, s) {
    const col = scoreColor(s, .30 + .30 * pulse);
    const r = 7, gap = 2.5;
    gCtx.save(); gCtx.strokeStyle = col; gCtx.lineWidth = 1.2; gCtx.lineCap = 'round';
    gCtx.shadowColor = col; gCtx.shadowBlur = 5;
    gCtx.beginPath();
    gCtx.moveTo(x - r, y); gCtx.lineTo(x - gap, y);
    gCtx.moveTo(x + gap, y); gCtx.lineTo(x + r, y);
    gCtx.moveTo(x, y - r); gCtx.lineTo(x, y - gap);
    gCtx.moveTo(x, y + gap); gCtx.lineTo(x, y + r);
    gCtx.stroke(); gCtx.restore();
  }
  T.forEach((t, i) => crosshair(t.x, t.y, scores ? scores[i] : 0.5));

  // ── Player landmarks + skeleton (when face detected and size OK) ───────────
  if (playerPts && !noFace) {
    // Player skeleton
    const pAvgNose  = (scores[0]+scores[1]+scores[2])/3;
    const pAvgMouth = (scores[3]+scores[4]+scores[5]+scores[6])/4;
    function pSkelLine(a, b, col) {
      gCtx.save(); gCtx.strokeStyle = col; gCtx.lineWidth = 1.2;
      gCtx.setLineDash([3, 4]); gCtx.globalAlpha = 0.50;
      gCtx.beginPath(); gCtx.moveTo(a.x, a.y); gCtx.lineTo(b.x, b.y); gCtx.stroke();
      gCtx.setLineDash([]); gCtx.restore();
    }
    const pNC = scoreColor(pAvgNose, 1), pMC = scoreColor(pAvgMouth, 1);
    pSkelLine(playerPts[0], playerPts[1], pNC); pSkelLine(playerPts[0], playerPts[2], pNC);
    pSkelLine(playerPts[1], playerPts[2], pNC);
    pSkelLine(playerPts[3], playerPts[5], pMC); pSkelLine(playerPts[5], playerPts[4], pMC);
    pSkelLine(playerPts[3], playerPts[6], pMC); pSkelLine(playerPts[6], playerPts[4], pMC);

    // Player dots — faded so the user's face stays clearly visible underneath
    playerPts.forEach((p, i) => {
      const col = scoreColor(scores[i], 0.42);
      gCtx.save(); gCtx.beginPath(); gCtx.arc(p.x, p.y, 4.5, 0, Math.PI*2);
      gCtx.fillStyle = col; gCtx.shadowColor = col; gCtx.shadowBlur = 6;
      gCtx.fill(); gCtx.restore();
    });

    // Green hole outline when all 7 roughly aligned
    if (scores.every(s => s > 0.50)) {
      gCtx.save();
      gCtx.strokeStyle = `rgba(80,255,80,${.4+.6*pulse})`;
      gCtx.lineWidth = 3.5; gCtx.shadowColor = '#80ff80'; gCtx.shadowBlur = 24;
      rrPath(gCtx, hole.x+4, hole.y+4, hole.w-8, hole.h-8, 9);
      gCtx.stroke(); gCtx.restore();
    }
  }

  // ── Eye + nose-bridge targets for levels 4-5 ──────────────────────────────
  if (showEyes && hole.eyeTargets) {
    const rEye = hole.eyeTargets[0], lEye = hole.eyeTargets[1];
    const s7 = (scores && scores[7] != null) ? scores[7] : 0.5;
    const s8 = (scores && scores[8] != null) ? scores[8] : 0.5;
    crosshair(rEye.x, rEye.y, s7);
    crosshair(lEye.x, lEye.y, s8);
    // Dashed connector line between eye targets
    skelLine(rEye, lEye, scoreColor((s7 + s8) / 2, 1));
    if (showBridge && hole.eyeTargets[2]) {
      const s9 = (scores && scores[9] != null) ? scores[9] : 0.5;
      crosshair(hole.eyeTargets[2].x, hole.eyeTargets[2].y, s9);
      // Connect nose bridge to each eye
      skelLine(hole.eyeTargets[2], rEye, scoreColor((s9+s7)/2, 1));
      skelLine(hole.eyeTargets[2], lEye, scoreColor((s9+s8)/2, 1));
    }
    // Player eye dots when face is detected
    if (playerPts && !noFace && playerPts.length >= 9) {
      [7, 8].forEach(i => {
        const col = scoreColor(scores[i], 0.42);
        gCtx.save(); gCtx.beginPath(); gCtx.arc(playerPts[i].x, playerPts[i].y, 4.5, 0, Math.PI*2);
        gCtx.fillStyle = col; gCtx.shadowColor = col; gCtx.shadowBlur = 6;
        gCtx.fill(); gCtx.restore();
      });
      if (showBridge && playerPts[9]) {
        const col = scoreColor(scores[9] ?? 0.5, 0.42);
        gCtx.save(); gCtx.beginPath(); gCtx.arc(playerPts[9].x, playerPts[9].y, 4, 0, Math.PI*2);
        gCtx.fillStyle = col; gCtx.shadowColor = col; gCtx.shadowBlur = 5;
        gCtx.fill(); gCtx.restore();
      }
    }
  }
}

// ═══════════════════════════════════════════════════════
//  FACE DETECTION
// ═══════════════════════════════════════════════════════
async function detect() {
  if (!detecting || winDone) return;
  const PW = procCanvas.width, PH = procCanvas.height;

  procCtx.save();
  procCtx.translate(PW, 0); procCtx.scale(-1, 1);
  procCtx.drawImage(videoEl, 0, 0, PW, PH);
  procCtx.restore();

  try {
    const det = await faceapi
      .detectSingleFace(procCanvas, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.35 }))
      .withFaceLandmarks(true);

    if (!det) {
      const lv0 = LEVELS[currentLevel];
      drawGuide(null, null, true, lv0.useEyes, lv0.useNoseBridge);
      push(0); setProgress(avg());
      statusText.textContent = '👆 Di chuyển mặt vào ô vàng…';
      return;
    }

    const pts = det.landmarks.positions;
    const lv  = LEVELS[currentLevel];
    const base = [pts[30], pts[31], pts[35], pts[48], pts[54], pts[51], pts[57]];
    const playerPts = lv.useEyes
      ? [...base, eyeCenter(pts,36,42), eyeCenter(pts,42,48),
         ...(lv.useNoseBridge ? [pts[27]] : [])]
      : base;
    const tgtPts = lv.useEyes
      ? [...hole.targets, hole.eyeTargets[0], hole.eyeTargets[1],
         ...(lv.useNoseBridge ? [hole.eyeTargets[2]] : [])]
      : hole.targets;

    // ── Scale check ───────────────────────────────────────────────────────────
    const pSpanV2 = (playerPts[5].y + playerPts[6].y)/2 - playerPts[0].y;
    const tSpanV2 = hole.mouthTgt.y - hole.noseTgt.y;
    const sRatio  = pSpanV2 / (tSpanV2 || 1);
    const sizeOk  = sRatio >= lv.scaleMin && sRatio <= lv.scaleMax;

    const dists  = playerPts.map((p, i) => dist(p, tgtPts[i]));
    const scores = dists.map(d => sc(d));

    drawGuide(playerPts, scores, !sizeOk, lv.useEyes, lv.useNoseBridge);

    if (!sizeOk) {
      push(0); setProgress(avg());
      statusText.textContent = sRatio < lv.scaleMin
        ? '📏 Lại gần hơn — mặt còn quá nhỏ!'
        : '📏 Lùi ra xa hơn — mặt quá to!';
      return;
    }

    // Weighted geometric mean — weight sets per landmark count
    const BASE_W = [1.5, 0.75, 0.75, 1.5, 1.5, 1.0, 1.0];
    const W = lv.useEyes
      ? [...BASE_W, 1.2, 1.2, ...(lv.useNoseBridge ? [0.8] : [])]
      : BASE_W;
    const W_SUM = W.reduce((a,b) => a+b, 0);
    let logSum = 0;
    for (let i = 0; i < W.length; i++) logSum += W[i] * Math.log(Math.max(scores[i], 1e-6));
    const frameScore = Math.exp(logSum / W_SUM);
    push(frameScore);

    // Capture the single best-aligned frame to use as the winning composite
    if (frameScore > bestScore) {
      bestScore = frameScore;
      if (!bestFrame) bestFrame = document.createElement('canvas');
      bestFrame.width = pCanvas.width; bestFrame.height = pCanvas.height;
      const bc = bestFrame.getContext('2d');
      bc.save(); bc.translate(bestFrame.width, 0); bc.scale(-1, 1);
      bc.drawImage(videoEl, 0, 0, bestFrame.width, bestFrame.height); bc.restore();
    }

    const a = avg(); setProgress(a);
    const nOk = dists[0] < hole.tol;
    const mOk = dists[3] < hole.tol && dists[4] < hole.tol;
    const eOk = !lv.useEyes || (dists[7] < hole.tol && dists[8] < hole.tol);
    statusText.textContent =
      nOk && mOk && eOk ? '🎯 Giữ nguyên…' :
      nOk || mOk        ? '📐 Gần rồi! Điều chỉnh thêm' :
                          '👆 Di chuyển mặt vào ô vàng…';

    const streak = alignBuf.slice(-lv.sLen).every(v => v >= lv.sFloor);
    if (a >= lv.winThresh && alignBuf.length >= Math.floor(lv.bufN*.85) && streak) triggerWin();
  } catch (_) {}
}

const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const sc   = d    => Math.max(0, 1 - d/(hole.tol*2.5));
const push = v    => { alignBuf.push(v); if(alignBuf.length>LEVELS[currentLevel].bufN) alignBuf.shift(); };
const avg  = ()   => alignBuf.length ? alignBuf.reduce((a,b)=>a+b,0)/alignBuf.length : 0;
const setProgress = f => { progressFill.style.width = Math.min(100,f*100)+'%'; };

function eyeCenter(pts, start, end) {
  let sx = 0, sy = 0, n = end - start;
  for (let i = start; i < end; i++) { sx += pts[i].x; sy += pts[i].y; }
  return { x: sx/n, y: sy/n };
}

// ═══════════════════════════════════════════════════════
//  GUIDE ANIMATION LOOP (redraws portrait+hole every frame)
// ═══════════════════════════════════════════════════════
function guideLoop() {
  if (!detecting) return;
  drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
  guideRAF = requestAnimationFrame(guideLoop);
}

// ═══════════════════════════════════════════════════════
//  WIN SEQUENCE
// ═══════════════════════════════════════════════════════
async function triggerWin() {
  if (winDone) return;
  winDone = true; detecting = false;
  clearInterval(detectTimer); cancelAnimationFrame(guideRAF);

  // Use the best-aligned captured frame (the peak match moment).
  // Fall back to the current camera frame if none was captured.
  let frozen = bestFrame;
  if (!frozen) {
    frozen = document.createElement('canvas');
    frozen.width  = pCanvas.width; frozen.height = pCanvas.height;
    const fCtx    = frozen.getContext('2d');
    fCtx.save(); fCtx.translate(frozen.width,0); fCtx.scale(-1,1);
    fCtx.drawImage(videoEl, 0, 0, frozen.width, frozen.height); fCtx.restore();
  }

  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

  // Show fullscreen win canvas
  winCanvas.width  = pCanvas.width; winCanvas.height = pCanvas.height;
  winCanvas.classList.remove('hidden');

  await animateReveal(frozen);
}

async function animateReveal(frozen) {
  const CW = winCanvas.width, CH = winCanvas.height;

  // Build the composite (portrait + styled player face) before animation starts
  const composite = buildComposite(frozen, CW, CH);

  spawnSparks(40); await sleep(260);

  // Phase: portrait-with-hole fades out, composite fades in (60 frames × 20ms = 1.2 s)
  const STEPS = 60;
  for (let i = 0; i <= STEPS; i++) {
    const t = eio(i / STEPS);
    winCtx.clearRect(0, 0, CW, CH);

    // Portrait+hole recedes
    const hα = Math.max(0, 1 - t * 1.2);
    if (hα > 0) {
      winCtx.save(); winCtx.globalAlpha = hα;
      drawPortraitWithHole(winCtx, CW, CH);
      winCtx.restore();
    }

    // Composite rises
    if (t > 0.10) {
      winCtx.save(); winCtx.globalAlpha = Math.min(1, (t - 0.10) / 0.70);
      winCtx.drawImage(composite, 0, 0);
      winCtx.restore();
    }

    // Golden shimmer pulse at seam (active t 0.25→0.90)
    if (t > 0.25 && t < 0.90) {
      const sP  = (t - 0.25) / 0.65;
      const sα  = Math.sin(sP * Math.PI) * 0.55;
      winCtx.save();
      const g = winCtx.createRadialGradient(hole.cx, hole.cy, hole.w*0.10, hole.cx, hole.cy, hole.w*0.78);
      g.addColorStop(0,   `rgba(255,230,100,${sα})`);
      g.addColorStop(0.5, `rgba(240,160,20,${sα*0.45})`);
      g.addColorStop(1,   'rgba(240,100,20,0)');
      winCtx.fillStyle = g;
      rrPath(winCtx, hole.x-6, hole.y-6, hole.w+12, hole.h+12, 14);
      winCtx.fill(); winCtx.restore();
    }

    if (i % 7 === 0) spawnSparks(5);
    await sleep(20);
  }

  // Final frame: pure composite — persists for screenshot
  winCtx.clearRect(0, 0, CW, CH);
  winCtx.drawImage(composite, 0, 0);

  spawnSparks(60);

  // Kick off the persistent, lingering magic aura around the face
  startWinMagic(composite, CW, CH);

  await sleep(280);

  // Short, small win message at the bottom
  winMsg.innerHTML =
    `<b style="font-size:1.05em">✨ Tuyệt vời!</b><br>` +
    `<span style="font-size:.92em;color:rgba(255,225,90,.9)">Bạn chính là ` +
    `<i style="color:gold">${CHARACTER}</i>!</span>`;
  $('win-msg-wrap').classList.remove('hidden');
  $('again-wrap').classList.remove('hidden');
  showLevelBar(true);
}

const clamp8 = v => v < 0 ? 0 : v > 255 ? 255 : v;

// Mean + std of RGB over an elliptical band [rhoMin, rhoMax] around (cx,cy).
// rho = normalized elliptical radius (1.0 == hole edge). Skips transparent px.
function sampleStats(data, w, h, cx, cy, hw, hh, rhoMin, rhoMax) {
  let n=0, s0=0,s1=0,s2=0, q0=0,q1=0,q2=0;
  for (let y=0; y<h; y++) {
    const dy = (y - cy) / hh;
    for (let x=0; x<w; x++) {
      const dx = (x - cx) / hw;
      const rho = Math.sqrt(dx*dx + dy*dy);
      if (rho < rhoMin || rho > rhoMax) continue;
      const i = (y*w + x) * 4;
      if (data[i+3] < 8) continue;
      const r=data[i], g=data[i+1], b=data[i+2];
      s0+=r; s1+=g; s2+=b; q0+=r*r; q1+=g*g; q2+=b*b; n++;
    }
  }
  if (!n) return null;
  const m = [s0/n, s1/n, s2/n];
  const sd = [
    Math.sqrt(Math.max(1, q0/n - m[0]*m[0])),
    Math.sqrt(Math.max(1, q1/n - m[1]*m[1])),
    Math.sqrt(Math.max(1, q2/n - m[2]*m[2])),
  ];
  return { mean: m, std: sd, n };
}

// Build the portrait composite: full portrait as background, player's face
// adaptively color/brightness-matched to the loaded portrait (Reinhard mean+std
// transfer sampled from the skin ring around the hole), partially transparent so
// the two images melt together, finished with a painted-texture overlay.
function buildComposite(frozen, CW, CH) {
  // ── 1. Base: full portrait (no hole) ────────────────────────────────────────
  const cCanvas = document.createElement('canvas');
  cCanvas.width = CW; cCanvas.height = CH;
  const cCtx = cCanvas.getContext('2d');
  drawPortraitLayer(cCtx, CW, CH);

  // ── 2. Patch region (hole + generous padding for soft edge) ─────────────────
  const PAD = 20;
  const sx  = Math.max(0, Math.floor(hole.x - PAD));
  const sy  = Math.max(0, Math.floor(hole.y - PAD));
  const sw  = Math.min(CW, Math.ceil(hole.x + hole.w + PAD)) - sx;
  const sh  = Math.min(CH, Math.ceil(hole.y + hole.h + PAD)) - sy;
  const mcx = hole.cx - sx;
  const mcy = hole.cy - sy;

  // ── 3. Adaptive color/brightness transfer — match the LOADED portrait ───────
  const faceCanvas = document.createElement('canvas');
  faceCanvas.width = sw; faceCanvas.height = sh;
  const fCtx = faceCanvas.getContext('2d');

  // Draw the raw player face first (no hardcoded filter)
  fCtx.drawImage(frozen, sx, sy, sw, sh, 0, 0, sw, sh);

  const hw = hole.w / 2, hh = hole.h / 2;
  let graded = false;
  try {
    // TARGET tone: portrait skin ring just OUTSIDE the hole (cheeks/chin/forehead)
    const halfMax = Math.max(hw, hh);
    const TPAD = Math.round(halfMax * 0.95);
    const tx = Math.max(0, Math.floor(hole.cx - hw - TPAD));
    const ty = Math.max(0, Math.floor(hole.cy - hh - TPAD));
    const tw = Math.min(CW, Math.ceil(hole.cx + hw + TPAD)) - tx;
    const th = Math.min(CH, Math.ceil(hole.cy + hh + TPAD)) - ty;
    const tData = cCtx.getImageData(tx, ty, tw, th).data;
    const tgt = sampleStats(tData, tw, th, hole.cx - tx, hole.cy - ty, hw, hh, 1.05, 1.85);

    // SOURCE tone: player face interior
    const fImg = fCtx.getImageData(0, 0, sw, sh);
    const fd = fImg.data;
    const src = sampleStats(fd, sw, sh, mcx, mcy, hw, hh, 0.0, 0.92);

    if (tgt && src) {
      // Per-channel std ratio (clamped) for contrast matching, plus a warm bias
      const ratio = c => Math.max(0.55, Math.min(1.65, tgt.std[c] / (src.std[c] || 1)));
      const r0 = ratio(0), r1 = ratio(1), r2 = ratio(2);
      const k = 0.88;  // transfer strength — keep a touch of the user's own tone
      for (let i = 0; i < fd.length; i += 4) {
        if (fd[i+3] < 8) continue;
        const nr = (fd[i]   - src.mean[0]) * r0 + tgt.mean[0];
        const ng = (fd[i+1] - src.mean[1]) * r1 + tgt.mean[1];
        const nb = (fd[i+2] - src.mean[2]) * r2 + tgt.mean[2];
        fd[i]   = clamp8(fd[i]   * (1-k) + nr * k);
        fd[i+1] = clamp8(fd[i+1] * (1-k) + ng * k);
        fd[i+2] = clamp8(fd[i+2] * (1-k) + nb * k);
      }
      fCtx.putImageData(fImg, 0, 0);
      graded = true;
    }
  } catch (_) {}

  // Fallback if pixel sampling failed: gentle desaturate + slight darken
  if (!graded) {
    const tmp = document.createElement('canvas');
    tmp.width = sw; tmp.height = sh;
    const tc = tmp.getContext('2d');
    tc.filter = 'saturate(0.62) brightness(0.86) contrast(0.92)';
    tc.drawImage(faceCanvas, 0, 0);
    fCtx.clearRect(0, 0, sw, sh);
    fCtx.drawImage(tmp, 0, 0);
  }

  // ── 4. Radial feather mask: wider + softer falloff than before ───────────────
  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = sw; maskCanvas.height = sh;
  const mCtx = maskCanvas.getContext('2d');
  const innerR = Math.min(hole.w, hole.h) * 0.20;
  const outerR = Math.max(hole.w, hole.h) * 0.76 + PAD;
  const feather = mCtx.createRadialGradient(mcx, mcy, innerR, mcx, mcy, outerR);
  feather.addColorStop(0,    'rgba(0,0,0,1)');
  feather.addColorStop(0.58, 'rgba(0,0,0,0.96)');
  feather.addColorStop(0.82, 'rgba(0,0,0,0.48)');
  feather.addColorStop(1,    'rgba(0,0,0,0)');
  mCtx.fillStyle = feather;
  mCtx.fillRect(0, 0, sw, sh);
  fCtx.globalCompositeOperation = 'destination-in';
  fCtx.drawImage(maskCanvas, 0, 0);
  fCtx.globalCompositeOperation = 'source-over';

  // ── 5. Blend face at ~82 % opacity — portrait background bleeds through ──────
  cCtx.globalAlpha = 0.82;
  cCtx.drawImage(faceCanvas, sx, sy);
  cCtx.globalAlpha = 1.0;

  // ── 6. Portrait painted-texture overlay: shadows/brushwork from the painting ─
  // Darkened grayscale of the portrait face multiplied onto the player face
  // makes skin look "painted", picking up the old-master shadow contours.
  if (portrait && portrait.complete && portrait.naturalWidth > 0) {
    try {
      const { s, ox, oy } = coverXform(CW, CH);
      const texCanvas = document.createElement('canvas');
      texCanvas.width = sw; texCanvas.height = sh;
      const tCtx = texCanvas.getContext('2d');
      tCtx.filter = 'saturate(0.08) brightness(0.50) contrast(1.65)';
      tCtx.drawImage(portrait,
        (sx - ox) / s, (sy - oy) / s, sw / s, sh / s,
        0, 0, sw, sh);
      tCtx.filter = 'none';
      // Apply same feather mask so texture stays within the blended area
      tCtx.globalCompositeOperation = 'destination-in';
      tCtx.drawImage(maskCanvas, 0, 0);
      tCtx.globalCompositeOperation = 'source-over';
      // Multiply onto composite — light portrait areas preserve face, dark
      // areas (shadows, contours) naturally darken corresponding face regions
      cCtx.globalCompositeOperation = 'multiply';
      cCtx.globalAlpha = 0.20;
      cCtx.drawImage(texCanvas, sx, sy);
      cCtx.globalCompositeOperation = 'source-over';
      cCtx.globalAlpha = 1.0;
    } catch (_) {}
  }

  // ── 7. Seam vignette: darkens the transition ring slightly ───────────────────
  const vigCanvas = document.createElement('canvas');
  vigCanvas.width = sw; vigCanvas.height = sh;
  const vCtx = vigCanvas.getContext('2d');
  const vig = vCtx.createRadialGradient(mcx, mcy, innerR * 1.4, mcx, mcy, outerR * 0.92);
  vig.addColorStop(0,    'rgba(0,0,0,0)');
  vig.addColorStop(0.70, 'rgba(0,0,0,0)');
  vig.addColorStop(0.86, 'rgba(0,0,0,0.28)');
  vig.addColorStop(1,    'rgba(0,0,0,0)');
  vCtx.fillStyle = vig;
  vCtx.fillRect(0, 0, sw, sh);
  cCtx.drawImage(vigCanvas, sx, sy);

  return cCanvas;
}

const SPARK_COLORS = ['#f0c040','#ff6b6b','#6bdcff','#c040f0','#40ff90','#fff','#ffa040','#ff40a0'];

function spawnSparks(n) {
  const cx = innerWidth/2, cy = innerHeight/2;
  for (let i=0; i<n; i++) {
    const el  = document.createElement('div');
    el.className = 'spark';
    const sz  = 5 + Math.random()*9;
    const ang = Math.random()*Math.PI*2;
    const rad = 80 + Math.random()*Math.max(innerWidth,innerHeight)*.55;
    const dur = .9 + Math.random()*1.3;
    Object.assign(el.style, {
      left:   (cx+(Math.random()-.5)*innerWidth*.8)+'px',
      top:    (cy+(Math.random()-.5)*innerHeight*.5)+'px',
      width:  sz+'px', height: sz+'px',
      background: SPARK_COLORS[Math.random()*SPARK_COLORS.length|0],
      '--tx': (Math.cos(ang)*rad)+'px',
      '--ty': (Math.sin(ang)*rad - 60 - Math.random()*140)+'px',
      animationDuration: dur+'s',
      animationDelay: (Math.random()*.25)+'s',
    });
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), (dur+.25)*1000+250);
  }
}

// Localized sparks emitted around a specific point (used for face-area magic)
function spawnSparksAt(cx, cy, spread, n) {
  for (let i=0; i<n; i++) {
    const el  = document.createElement('div');
    el.className = 'spark';
    const sz  = 4 + Math.random()*7;
    const ang = Math.random()*Math.PI*2;
    const rad = 30 + Math.random()*spread*0.9;
    const dur = 1.1 + Math.random()*1.4;
    Object.assign(el.style, {
      left:   (cx + (Math.random()-.5)*spread)+'px',
      top:    (cy + (Math.random()-.5)*spread*0.9)+'px',
      width:  sz+'px', height: sz+'px',
      background: SPARK_COLORS[Math.random()*SPARK_COLORS.length|0],
      boxShadow: '0 0 6px currentColor',
      '--tx': (Math.cos(ang)*rad)+'px',
      '--ty': (Math.sin(ang)*rad - 50 - Math.random()*90)+'px',
      animationDuration: dur+'s',
      animationDelay: (Math.random()*.3)+'s',
    });
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), (dur+.35)*1000+300);
  }
}

// Small twinkling 4-point star glint on a canvas
function drawGlint(ctx, x, y, r, col) {
  ctx.save();
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.shadowColor = col; ctx.shadowBlur = r*2.5;
  ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r*0.32, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
//  PERSISTENT WIN MAGIC — lingering shimmering aura around the face
// ═══════════════════════════════════════════════════════
function startWinMagic(composite, CW, CH) {
  stopWinMagic();
  const cx = hole.cx, cy = hole.cy;
  const baseR = Math.max(hole.w, hole.h);
  const t0 = performance.now();

  function frame(now) {
    const t = (now - t0) / 1000;
    winCtx.clearRect(0, 0, CW, CH);
    winCtx.drawImage(composite, 0, 0);

    winCtx.save();
    winCtx.globalCompositeOperation = 'lighter';

    // Breathing golden halo hugging the face edge (transparent center → face stays clear)
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.5);
    const haloR = baseR * (0.78 + 0.12 * pulse);
    const a = 0.10 + 0.12 * pulse;
    const g = winCtx.createRadialGradient(cx, cy, baseR * 0.42, cx, cy, haloR);
    g.addColorStop(0,    'rgba(255,228,130,0)');
    g.addColorStop(0.68, `rgba(255,212,95,${a*0.45})`);
    g.addColorStop(0.90, `rgba(255,178,45,${a})`);
    g.addColorStop(1,    'rgba(255,150,20,0)');
    winCtx.fillStyle = g;
    winCtx.beginPath(); winCtx.arc(cx, cy, haloR, 0, Math.PI*2); winCtx.fill();

    // Two counter-rotating rings of twinkling glints orbiting the face
    const rings = [
      { n: 8, r: baseR*0.74, spd:  0.55, ph: 0    },
      { n: 6, r: baseR*0.92, spd: -0.40, ph: 0.7  },
    ];
    rings.forEach(ring => {
      for (let i = 0; i < ring.n; i++) {
        const ang = t * ring.spd + ring.ph + i * (Math.PI*2 / ring.n);
        const gx  = cx + Math.cos(ang) * ring.r;
        const gy  = cy + Math.sin(ang) * ring.r * 0.94;
        const tw  = 0.5 + 0.5 * Math.sin(t * 3.2 + i * 1.9);
        drawGlint(winCtx, gx, gy, 2.2 + 3.4 * tw, `rgba(255,232,150,${0.35 + 0.55*tw})`);
      }
    });
    winCtx.restore();

    winMagicRAF = requestAnimationFrame(frame);
  }
  winMagicRAF = requestAnimationFrame(frame);

  // Continuous gentle spark emission localized to the face area
  winSparkTimer = setInterval(() => {
    spawnSparksAt(hole.cx, hole.cy, baseR * 1.5, 3);
  }, 600);
}

function stopWinMagic() {
  if (winMagicRAF)   { cancelAnimationFrame(winMagicRAF); winMagicRAF = null; }
  if (winSparkTimer) { clearInterval(winSparkTimer);      winSparkTimer = null; }
}

const eio   = t => t<.5 ? 2*t*t : -1+(4-2*t)*t;
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function startGame() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'user', width:{ideal:1280}, height:{ideal:720} }
    });
    videoEl.srcObject = mediaStream;
    await new Promise(r => { videoEl.onloadedmetadata = r; });
    await videoEl.play();
  } catch(e) {
    alert('Không thể truy cập camera 😢\n'+e.message);
    return;
  }

  winDone = false; detecting = false;
  alignBuf = [];
  bestScore = -1; bestFrame = null;
  stopWinMagic();
  progressFill.style.width = '0%';
  statusText.textContent = '👆 Di chuyển mặt vào ô vàng…';
  winMsg.innerHTML = '';

  $('start-overlay').classList.add('hidden');
  $('win-msg-wrap').classList.add('hidden');
  $('again-wrap').classList.add('hidden');
  winCanvas.classList.add('hidden');
  showLevelBar(false);

  $('title-pill').style.display = 'block';
  $('hud').style.display = 'flex';

  detecting = true;
  guideLoop();
  detectTimer = setInterval(detect, 110);
}

// ═══════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════
async function boot() {
  resize();
  window.addEventListener('resize', () => {
    resize();
    if (!detecting) drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
  });

  // Draw fallback immediately (dark canvas not blank)
  drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
  showEdges(true);

  // 1 · Load portrait via fetch → blob URL (same-origin, no canvas CORS issues)
  $('loading-pill').textContent = 'Đang tải chân dung huyền bí… 🖼️';
  try {
    const resp = await fetch(PORTRAIT_SRC);
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    const blob = await resp.blob();
    portrait = new Image();
    portrait.src = URL.createObjectURL(blob);
    await new Promise((res,rej) => { portrait.onload=res; portrait.onerror=rej; });
    imgNW = portrait.naturalWidth  || 402;
    imgNH = portrait.naturalHeight || 602;
    computeHole();
    drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height); // upgrade to real image
  } catch(e) {
    console.warn('Portrait fetch failed, using canvas fallback:', e.message);
    portrait = null;
  }

  // 2 · Load AI models
  $('loading-pill').textContent = 'Đang nạp trí tuệ nhân tạo… 🤖';
  try {
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
  } catch(e) {
    throw new Error('Không tải được AI model. Kiểm tra kết nối mạng.\n'+e.message);
  }

  modelsReady = true;

  // 3 · Auto-calibrate hole position by detecting face landmarks in portrait
  $('loading-pill').textContent = 'Đang căn chỉnh vị trí mũi miệng… 🎯';
  await calibrateHole();

  // 4 · Ready
  showEdges(false);
  $('loading-pill').classList.add('hidden');
  $('start-overlay').classList.remove('hidden');
  showLevelBar(true);
}

    .replace(/\.[^.]+$/, '')
    .replace(/[_\-\.]+/g, ' ')
    .trim()
    .replace(/\b\w/g, c => c.toUpperCase()) || 'Nhân Vật Bí Ẩn';

  showToast('⏳ Đang tải hình…', 'info', 60000);

  // Load image from local file (blob URL = same-origin, no CORS issue)
  try {
    const url = URL.createObjectURL(file);
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    portrait = img;
    imgNW    = img.naturalWidth;
    imgNH    = img.naturalHeight;
    // Reset hole to fallback fractions + default targets before calibration
    HOLE_XF = 0.360; HOLE_YF = 0.292; HOLE_WF = 0.195; HOLE_HF = 0.085;
    NOSE_IN_H = 0.30; MOUTH_IN_H = 0.72;
    holeTargets = DEFAULT_TARGETS.map(t => ({ ...t }));
    eyeTargetsFrac = [
      { rx: 0.385, ry: 0.222 }, { rx: 0.595, ry: 0.222 }, { rx: 0.498, ry: 0.185 },
    ];
    computeHole();
    drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
  } catch (e) {
    showToast('❌ Không tải được hình', 'error');
    return;
  }

  // Auto-calibrate if models are ready
  if (modelsReady) {
    showToast('🔍 Đang xác định vị trí mũi miệng…', 'info', 60000);
    const ok = await calibrateHole();
    showToast(
      ok ? '✅ Đã xác định vị trí mũi miệng!' : '⚠️ Không nhận ra khuôn mặt — dùng vị trí mặc định',
      ok ? 'success' : 'error'
    );
  } else {
    showToast('✅ Hình đã tải! (AI đang nạp, tự căn chỉnh sau…)', 'success');
  }

  // Ensure we're at the start screen
  $('win-msg-wrap').classList.add('hidden');
  $('again-wrap').classList.add('hidden');
  winCanvas.classList.add('hidden');
  $('loading-pill').classList.add('hidden');
  $('start-overlay').classList.remove('hidden');
});

// ═══════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════
$('start-btn').addEventListener('click', startGame);

$('again-btn').addEventListener('click', () => {
  stopWinMagic();
  $('win-msg-wrap').classList.add('hidden');
  $('again-wrap').classList.add('hidden');
  winCanvas.classList.add('hidden');
  $('title-pill').style.display = 'none';
  $('hud').style.display = 'none';
  $('loading-pill').classList.remove('hidden');
  $('loading-pill').textContent = '✨ Sẵn sàng chơi lại!';
  setTimeout(() => {
    $('loading-pill').classList.add('hidden');
    drawPortraitWithHole(pCtx, pCanvas.width, pCanvas.height);
    $('start-overlay').classList.remove('hidden');
    showLevelBar(true);
  }, 600);
});

// ═══════════════════════════════════════════════════════
//  GO
// ═══════════════════════════════════════════════════════
boot().catch(err => {
  console.error('Boot error:', err);
  showEdges(false);
  $('loading-pill').textContent = '❌ ' + err.message;
  $('loading-pill').style.color = '#ff8080';
});
</script>
</body>
</html>
